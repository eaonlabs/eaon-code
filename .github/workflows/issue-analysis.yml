# Issue analysis is intentionally disabled in the Eaon Code fork.
#
# The upstream workflow depended on organization membership checks, private
# auth and gist secrets, a Pi-specific bot, and a Pi-hosted version endpoint.
# Re-enable this stub only after defining Eaon-owned equivalents and documenting
# the required repository/environment secrets in the workflow.

name: Issue analysis (disabled)

on:
	issues:
		types: [labeled]
	issue_comment:
		types: [created]

jobs:
	disabled:
		if: ${{ false }}
		runs-on: ubuntu-latest
		steps:
			- name: Explain disabled workflow
				run: echo "Eaon Code issue analysis is disabled until fork-owned auth and automation are configured."
