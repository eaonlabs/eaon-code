<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="description" content="Science Lab: Investigation Zero — do the science. An interactive scientific-method lab simulator." />
<title>SCIENCE LAB · Investigation Zero</title>
<style>
/* ============================================================
   SCIENCE LAB — Investigation Zero
   Design tokens
   ============================================================ */
:root{
  --bg:#eef2f1;
  --bg2:#e4eae8;
  --surface:#ffffff;
  --glass:rgba(255,255,255,.72);
  --glass2:rgba(255,255,255,.5);
  --ink:#12211f;
  --ink2:#31423f;
  --muted:#647774;
  --line:rgba(18,40,38,.12);
  --line2:rgba(18,40,38,.07);
  --grn:#0f9d7a;
  --grn-soft:#e3f5ee;
  --blu:#2f6fed;
  --blu-soft:#e6eefe;
  --amb:#c9761a;
  --amb-soft:#fdf0dd;
  --red:#c9435a;
  --red-soft:#fce9ec;
  --vio:#6b4fd6;
  --r-s:8px; --r-m:14px; --r-l:20px;
  --sh-1:0 1px 2px rgba(18,40,38,.05), 0 2px 8px rgba(18,40,38,.05);
  --sh-2:0 2px 6px rgba(18,40,38,.07), 0 12px 32px rgba(18,40,38,.09);
  --sh-3:0 24px 60px rgba(18,40,38,.18);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --topbar:58px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 12% -10%, #ffffff 0%, rgba(255,255,255,0) 60%),
    radial-gradient(900px 500px at 100% 0%, var(--blu-soft) 0%, rgba(230,238,254,0) 55%),
    linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
  background-attachment:fixed;
  min-height:100vh;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(1000px 700px at 50% 0%,#000 0%,transparent 85%);
  -webkit-mask-image:radial-gradient(1000px 700px at 50% 0%,#000 0%,transparent 85%);
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:6px}
::selection{background:rgba(15,157,122,.22)}

/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(18,40,38,.18);border-radius:20px;border:3px solid transparent;background-clip:content-box}

/* ============================================================
   Shell
   ============================================================ */
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:60;
  height:var(--topbar);
  display:flex;align-items:center;gap:10px;
  padding:0 12px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px) saturate(1.3);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-m);transition:background .18s}
.brand:hover{background:rgba(18,40,38,.05)}
.brand .mark{width:30px;height:30px;flex:0 0 auto}
.brand .bt{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.brand .bt b{font-size:13px;letter-spacing:.16em;font-weight:800}
.brand .bt span{font-size:9.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.spacer{flex:1 1 auto}
.hud{display:flex;align-items:center;gap:6px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 10px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);
  font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--ink2);
  white-space:nowrap;
}
.pill .k{font-size:9.5px;letter-spacing:.14em;color:var(--muted);font-weight:700;text-transform:uppercase}
.pill b{font-variant-numeric:tabular-nums;font-weight:800}
.pill.icon{width:32px;padding:0;justify-content:center;font-size:14px}
.ai-chip{cursor:help}
.ai-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px rgba(100,119,116,.14)}
.ai-chip[data-on="1"] .dot{background:var(--grn);box-shadow:0 0 0 3px rgba(15,157,122,.16);animation:pulseDot 2.6s ease-in-out infinite}
.ai-chip[data-busy="1"] .dot{background:var(--amb);box-shadow:0 0 0 3px rgba(201,118,26,.16)}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.45}}

.view{flex:1 1 auto;width:100%;max-width:1220px;margin:0 auto;padding:18px 14px 96px}
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  display:none;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.dock::-webkit-scrollbar{display:none}
.dock button{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;
  min-width:60px;padding:5px 8px;border-radius:12px;font-size:9.5px;letter-spacing:.05em;color:var(--muted);font-weight:700;text-transform:uppercase;
}
.dock button svg{width:20px;height:20px}
.dock button[aria-current="true"]{color:var(--grn);background:var(--grn-soft)}
.dock button[disabled]{opacity:.35}

/* ============================================================
   Primitives
   ============================================================ */
.panel{
  background:var(--glass);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:var(--r-l);
  box-shadow:var(--sh-1);
  padding:16px;
}
.panel.solid{background:var(--surface)}
.panel.flush{padding:0;overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-h h3{margin:0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:800}
.panel-h .sub{font-size:11.5px;color:var(--muted);font-weight:600}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--grn);font-weight:800}
.h1{font-size:clamp(22px,4.6vw,34px);line-height:1.1;margin:6px 0 4px;letter-spacing:-.02em;font-weight:800}
.h2{font-size:clamp(17px,3.4vw,23px);line-height:1.2;margin:0 0 6px;letter-spacing:-.01em;font-weight:800}
.lede{color:var(--muted);font-size:14px;margin:0}
.mono{font-family:var(--mono)}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(18,40,38,.06);color:var(--ink2);
}
.tag.g{background:var(--grn-soft);color:#0a6b53}
.tag.b{background:var(--blu-soft);color:#2050b8}
.tag.a{background:var(--amb-soft);color:#8d5210}
.tag.r{background:var(--red-soft);color:#a12c40}

.btn{
  --bgc:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:42px;padding:0 16px;border-radius:12px;
  background:var(--bgc);border:1px solid var(--line);
  font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);box-shadow:var(--sh-1);
  transition:transform .12s ease, box-shadow .18s ease, background .18s ease, opacity .18s;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.p{--bgc:linear-gradient(180deg,#12b48c,#0d8f6f);color:#fff;border-color:rgba(9,90,70,.4);text-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.b{--bgc:linear-gradient(180deg,#4b83f2,#2a63df);color:#fff;border-color:rgba(24,64,150,.35);text-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.w{--bgc:linear-gradient(180deg,#e0913a,#c9761a);color:#fff;border-color:rgba(120,70,12,.3)}
.btn.q{--bgc:transparent;box-shadow:none;border-color:var(--line);color:var(--ink2);min-height:38px;font-size:12px}
.btn.q:hover{background:rgba(18,40,38,.05);box-shadow:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:11.5px;border-radius:10px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.grid{display:grid;gap:12px}
.divider{height:1px;background:var(--line);margin:14px 0}
.small{font-size:12px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted);line-height:1.45}
kbd{font-family:var(--mono);font-size:10.5px;background:rgba(18,40,38,.07);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px}

/* fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.inp{
  width:100%;min-height:44px;padding:11px 13px;border-radius:12px;
  background:rgba(255,255,255,.9);border:1px solid var(--line);
  font-size:15px;color:var(--ink);
  transition:border-color .18s, box-shadow .18s, background .18s;
}
textarea.inp{min-height:78px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--grn);box-shadow:0 0 0 3px rgba(15,157,122,.14);background:#fff}
.inp::placeholder{color:#9fb0ad}
.inp.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(201,67,90,.12)}
.inp.ok{border-color:var(--grn)}

/* ============================================================
   Drag & drop
   ============================================================ */
.drag{
  position:relative;min-width:0;overflow-wrap:anywhere;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:9px 11px;font-size:13px;font-weight:700;color:var(--ink);
  box-shadow:var(--sh-1);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  transition:transform .16s cubic-bezier(.2,.9,.3,1.3), box-shadow .18s, opacity .18s, border-color .18s;
  display:flex;align-items:center;gap:8px;
}
.drag:active{cursor:grabbing}
.drag:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.drag.sel{border-color:var(--grn);box-shadow:0 0 0 3px rgba(15,157,122,.18)}
.drag.lifting{opacity:.32}
.drag .grip{opacity:.35;font-size:11px;letter-spacing:-1px}
.drag.locked{cursor:default;background:rgba(18,40,38,.04);color:var(--muted)}
.ghost{
  position:fixed;z-index:999;pointer-events:none;left:0;top:0;
  box-shadow:var(--sh-3);transform-origin:center;
  will-change:transform;
}
.drop{
  border:1.5px dashed rgba(18,40,38,.22);border-radius:14px;
  background:rgba(255,255,255,.4);
  min-height:64px;padding:10px;
  transition:border-color .18s, background .18s, box-shadow .18s, transform .18s;
}
.drop.over{border-color:var(--grn);background:rgba(15,157,122,.09);box-shadow:0 0 0 4px rgba(15,157,122,.1)}
.drop.bad{border-color:var(--red);background:rgba(201,67,90,.08)}
.drop.filled{border-style:solid;border-color:rgba(18,40,38,.16);background:rgba(255,255,255,.75)}
.drop .ph{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:6px}
.drop .ph svg{width:14px;height:14px;opacity:.6}
.rack{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.rack.col{flex-direction:column;flex-wrap:nowrap}

/* ============================================================
   Feedback
   ============================================================ */
.feed{
  border-radius:var(--r-m);padding:12px 14px;font-size:13.5px;line-height:1.55;
  border:1px solid var(--line);background:rgba(255,255,255,.7);
  display:flex;gap:10px;align-items:flex-start;
  animation:fadeUp .3s cubic-bezier(.2,.8,.3,1) both;
}
.feed .ic{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;margin-top:1px}
.feed.good{background:var(--grn-soft);border-color:rgba(15,157,122,.35)}
.feed.good .ic{background:var(--grn)}
.feed.bad{background:var(--red-soft);border-color:rgba(201,67,90,.3)}
.feed.bad .ic{background:var(--red)}
.feed.warn{background:var(--amb-soft);border-color:rgba(201,118,26,.32)}
.feed.warn .ic{background:var(--amb)}
.feed.info{background:var(--blu-soft);border-color:rgba(47,111,237,.28)}
.feed.info .ic{background:var(--blu)}
.feed b{font-weight:800}
.feed .fx{margin-top:8px}
.judging{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.judging .sp{width:13px;height:13px;border-radius:50%;border:2px solid rgba(18,40,38,.16);border-top-color:var(--grn);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* meters */
.meter{height:7px;border-radius:99px;background:rgba(18,40,38,.09);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#12b48c,#0d8f6f);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bars{display:flex;gap:3px}
.bars i{width:15px;height:9px;border-radius:2px;background:rgba(18,40,38,.12);display:block}
.bars i.on{background:linear-gradient(180deg,#12b48c,#0d8f6f)}
.bars i.mid{background:linear-gradient(180deg,#e0913a,#c9761a)}

/* ============================================================
   Home / station map
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  border-radius:26px;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(255,255,255,.92),rgba(255,255,255,.6));
  box-shadow:var(--sh-2);
  padding:22px;margin-bottom:16px;
}
.hero .beam{position:absolute;inset:auto -20% -60% 30%;height:220px;background:radial-gradient(50% 60% at 50% 50%,rgba(15,157,122,.22),transparent 70%);filter:blur(6px);pointer-events:none}
.hero-in{position:relative;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.power{display:flex;align-items:center;gap:10px;margin-top:12px}
.power .cells{display:flex;gap:4px}
.power .cells i{width:16px;height:9px;border-radius:2px;background:rgba(18,40,38,.12);transition:background .4s, box-shadow .4s}
.power .cells i.on{background:linear-gradient(180deg,#12b48c,#0d8f6f);box-shadow:0 0 8px rgba(15,157,122,.5)}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.sta{
  position:relative;overflow:hidden;text-align:left;
  border-radius:var(--r-l);border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(255,255,255,.95),rgba(255,255,255,.66));
  box-shadow:var(--sh-1);padding:14px;
  display:flex;flex-direction:column;gap:8px;min-height:150px;
  transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .22s, border-color .2s;
}
.sta:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:rgba(15,157,122,.4)}
.sta .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--grn-soft);border:1px solid rgba(15,157,122,.22)}
.sta .ico svg{width:24px;height:24px;stroke:#0a6b53}
.sta h4{margin:0;font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.sta p{margin:0;font-size:12px;color:var(--muted);line-height:1.42}
.sta .st{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.sta[data-state="open"] .st{color:var(--grn)}
.sta[data-state="done"] .ico{background:var(--blu-soft);border-color:rgba(47,111,237,.22)}
.sta[data-state="done"] .ico svg{stroke:#2050b8}
.sta[data-state="locked"]{filter:saturate(.25);opacity:.62}
.sta[data-state="locked"]:hover{transform:none;box-shadow:var(--sh-1);border-color:var(--line)}
.sta .lock{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.1em;font-weight:800;color:var(--muted);background:rgba(18,40,38,.06);padding:3px 7px;border-radius:99px}
.sta .prog{height:4px;border-radius:99px;background:rgba(18,40,38,.09);overflow:hidden}
.sta .prog i{display:block;height:100%;background:linear-gradient(90deg,#12b48c,#2f6fed);transition:width .7s}

/* ============================================================
   Station chrome
   ============================================================ */
.sta-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sta-head .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--grn-soft);flex:0 0 auto}
.sta-head .ico svg{width:22px;height:22px;stroke:#0a6b53}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
.cols.narrow{grid-template-columns:minmax(0,1fr) minmax(0,.72fr)}
@media (max-width:900px){.cols,.cols.narrow{grid-template-columns:minmax(0,1fr)}}
.step-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.step-strip .s{
  display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;
  background:rgba(18,40,38,.05);color:var(--muted);border:1px solid transparent;
}
.step-strip .s.on{background:var(--grn-soft);color:#0a6b53;border-color:rgba(15,157,122,.28)}
.step-strip .s.done{background:rgba(47,111,237,.1);color:#2050b8}
.step-strip .s i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}

/* ============================================================
   Apparatus
   ============================================================ */
.stage{
  position:relative;border-radius:var(--r-l);overflow:hidden;
  background:linear-gradient(180deg,#f7faf9,#eaf0ee);
  border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff, var(--sh-1);
}
.stage svg{display:block;width:100%;height:auto}
.readout{
  position:absolute;left:10px;bottom:10px;right:10px;
  display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;
}
.rd{
  background:rgba(12,26,24,.86);color:#cfe9df;border-radius:9px;
  padding:5px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;
  border:1px solid rgba(255,255,255,.08);pointer-events:auto;cursor:default;
}
.rd b{color:#7ef0c4;font-weight:700}
.rd.hot{background:rgba(201,67,90,.92);color:#fff}

/* bubbles */
.bubwrap{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}
.bub{
  position:absolute;bottom:0;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(190,235,255,.42) 55%,rgba(120,200,230,.15));
  border:1px solid rgba(255,255,255,.5);
  animation:rise linear forwards;
}
@keyframes rise{
  0%{transform:translate3d(0,0,0) scale(.6);opacity:0}
  12%{opacity:.95}
  100%{transform:translate3d(var(--dx,0px),var(--h,-160px),0) scale(1);opacity:0}
}
.lampglow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(18px);transition:opacity .5s ease, transform .5s ease}
.rays{position:absolute;pointer-events:none;overflow:hidden;mix-blend-mode:multiply}
.rays i{position:absolute;top:0;width:2px;background:linear-gradient(180deg,rgba(255,204,90,.85),rgba(255,204,90,0));transform-origin:top center;animation:flick 3.4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.75}50%{opacity:.35}}
.screens{position:absolute;pointer-events:none;display:flex;gap:3px;align-items:stretch}
.screens i{flex:1;background:repeating-linear-gradient(45deg,rgba(90,110,105,.5) 0 2px,rgba(120,140,135,.28) 2px 5px);border:1px solid rgba(60,80,75,.35);border-radius:2px;animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.warnlight{
  position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:6px;
  background:rgba(201,67,90,.94);color:#fff;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 9px;border-radius:99px;animation:shake .5s ease-in-out;
}
.warnlight::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulseDot .8s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.shake{animation:shake .45s ease-in-out}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .34s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp .34s cubic-bezier(.2,.8,.3,1) both}

/* ============================================================
   Observation trays
   ============================================================ */
.trays{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.trays{grid-template-columns:minmax(0,1fr)}}
.tray{
  border-radius:var(--r-m);border:1px solid var(--line);background:rgba(255,255,255,.62);
  padding:10px;display:flex;flex-direction:column;gap:8px;min-height:132px;
}
.tray .th{display:flex;align-items:center;gap:7px}
.tray .th b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.tray .th .n{margin-left:auto;font-size:10px;color:var(--muted);font-weight:800}
.tray.q{border-color:rgba(107,79,214,.3);background:linear-gradient(180deg,rgba(107,79,214,.07),rgba(255,255,255,.6))}
.tray.n{border-color:rgba(47,111,237,.3);background:linear-gradient(180deg,rgba(47,111,237,.07),rgba(255,255,255,.6))}
.tray.i{border-color:rgba(201,118,26,.32);background:linear-gradient(180deg,rgba(201,118,26,.07),rgba(255,255,255,.6))}
.tray .items{display:flex;flex-direction:column;gap:6px;min-height:44px}
.chipnote{
  display:flex;gap:7px;align-items:flex-start;padding:8px 10px;border-radius:10px;
  background:var(--surface);border:1px solid var(--line);font-size:12.5px;line-height:1.4;
}
.chipnote .m{flex:0 0 auto;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;margin-top:2px}
.chipnote.ok{border-color:rgba(15,157,122,.4)}
.chipnote.ok .m{background:var(--grn)}
.chipnote.no{border-color:rgba(201,67,90,.32);background:rgba(252,233,236,.6)}
.chipnote.no .m{background:var(--red)}

/* ============================================================
   Hypothesis forge
   ============================================================ */
.blocks{display:flex;flex-direction:column;gap:10px}
.blk{
  display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;
  border-radius:var(--r-m);border:1px solid var(--line);background:rgba(255,255,255,.75);padding:10px;
  transition:border-color .2s, box-shadow .2s;
}
.blk .lab{
  font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  padding:8px 6px;border-radius:9px;text-align:center;background:rgba(18,40,38,.06);color:var(--ink2);
}
.blk.if .lab{background:var(--blu-soft);color:#2050b8}
.blk.then .lab{background:var(--grn-soft);color:#0a6b53}
.blk.bec .lab{background:var(--amb-soft);color:#8d5210}
.rubric{display:flex;flex-direction:column;gap:8px}
.rub{display:grid;grid-template-columns:104px 1fr 30px;gap:8px;align-items:center;font-size:12px}
.rub .nm{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* ============================================================
   Build / sockets
   ============================================================ */
.sockets{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.sockets{grid-template-columns:minmax(0,1fr)}}
.sock{border-radius:var(--r-m);border:1.5px dashed rgba(18,40,38,.2);padding:10px;background:rgba(255,255,255,.5);min-height:112px}
.sock .sh{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.sock .sh b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.sock .sh .d{width:9px;height:9px;border-radius:50%;background:rgba(18,40,38,.16)}
.sock[data-k="iv"]{border-color:rgba(47,111,237,.35)}
.sock[data-k="iv"] .d{background:var(--blu)}
.sock[data-k="dv"]{border-color:rgba(15,157,122,.35)}
.sock[data-k="dv"] .d{background:var(--grn)}
.sock[data-k="cv"]{border-color:rgba(107,79,214,.3)}
.sock[data-k="cv"] .d{background:var(--vio)}
.sock.over{background:rgba(15,157,122,.08)}
.sock.filled{border-style:solid}
.sock .in{display:flex;flex-direction:column;gap:6px;min-height:34px}
.machine{position:relative;border-radius:var(--r-l);overflow:hidden}
.machine.live .core{animation:coreOn 1.1s ease-in-out infinite alternate}
@keyframes coreOn{from{filter:drop-shadow(0 0 2px rgba(15,157,122,.4))}to{filter:drop-shadow(0 0 12px rgba(15,157,122,.9))}}
.wire{stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}

/* ============================================================
   Design bench / setup cards
   ============================================================ */
.bench{display:grid;gap:10px}
.locks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lock{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;
  background:rgba(255,255,255,.8);border:1px solid var(--line);font-size:12.5px;
  transition:border-color .2s, background .2s, transform .2s;
}
.lock .nm{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.lock .vl{font-weight:800;font-variant-numeric:tabular-nums}
.lock .sw{margin-left:auto;width:38px;height:21px;border-radius:99px;background:rgba(18,40,38,.16);position:relative;transition:background .22s;flex:0 0 auto}
.lock .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.2,.9,.3,1.4)}
.lock.on{border-color:rgba(201,67,90,.45);background:rgba(252,233,236,.7)}
.lock.on .sw{background:var(--red)}
.lock.on .sw::after{transform:translateX(17px)}
.lock.keep{border-color:rgba(15,157,122,.4);background:rgba(227,245,238,.7)}

.card2{border-radius:var(--r-m);border:1px solid var(--line);background:rgba(255,255,255,.82);overflow:hidden}
.card2 .ch{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;background:rgba(18,40,38,.03)}
.attr{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:13px;
  transition:background .2s;cursor:pointer;position:relative;
}
.attr:last-child{border-bottom:0}
.attr .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;min-width:104px}
.attr .v{font-weight:700;min-width:0;overflow-wrap:anywhere}
.attr:hover{background:rgba(47,111,237,.06)}
.attr.flag{background:rgba(252,233,236,.85)}
.attr.flag::after{content:"⚑";position:absolute;right:10px;color:var(--red);font-size:14px}
.attr.same{background:rgba(227,245,238,.6)}
.attr.iv{background:rgba(230,238,254,.7)}

/* ============================================================
   Notebook / table / graph
   ============================================================ */
.nb{
  border-radius:var(--r-m);background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.9) 0 27px,rgba(47,111,237,.06) 27px 28px);
  border:1px solid var(--line);padding:12px;box-shadow:var(--sh-1);
}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th{
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800;
  text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);
}
table.dt td{padding:7px 8px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
table.dt tr:last-child td{border-bottom:0}
table.dt .num{font-family:var(--mono);font-weight:700}
table.dt input{width:64px;padding:5px 7px;border-radius:8px;border:1px solid var(--line);background:#fff;font-family:var(--mono);font-weight:700;text-align:center}
table.dt input:focus{outline:none;border-color:var(--grn);box-shadow:0 0 0 3px rgba(15,157,122,.14)}
table.dt .cellbtn{padding:4px 8px;border-radius:8px;background:rgba(18,40,38,.05);font-size:11px;font-weight:800;letter-spacing:.06em}
table.dt .cellbtn:hover{background:rgba(15,157,122,.16)}

.graphwrap{position:relative;border-radius:var(--r-m);background:#fff;border:1px solid var(--line);overflow:hidden}
.axis-plate{
  min-height:46px;border-radius:12px;border:1.5px dashed rgba(18,40,38,.2);
  display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.5);
  transition:all .2s;
}
.axis-plate .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.axis-plate.filled{border-style:solid;border-color:rgba(15,157,122,.45);background:rgba(227,245,238,.6)}
.gline{stroke-dasharray:var(--len,1000);stroke-dashoffset:var(--len,1000);animation:draw 1.4s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gpt{opacity:0;animation:pop .4s cubic-bezier(.2,.9,.3,1.3) forwards}

/* radar */
.radar-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.skill-list{display:flex;flex-direction:column;gap:6px;flex:1 1 240px;min-width:0}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 74px 34px;gap:8px;align-items:center;font-size:12px}
.skill .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.skill .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;font-size:11.5px}

/* badges */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.bdg{
  display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:12px;
  background:rgba(18,40,38,.04);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);
}
.bdg.got{background:linear-gradient(160deg,#fff7e6,#ffeecb);border-color:rgba(201,118,26,.4);color:#7d4a0d}
.bdg .e{font-size:16px}

/* ============================================================
   Modal / toast
   ============================================================ */
.scrim{position:fixed;inset:0;z-index:200;background:rgba(12,26,24,.42);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s both}
.modal{
  width:min(560px,100%);max-height:86vh;overflow:auto;
  background:var(--surface);border-radius:22px;box-shadow:var(--sh-3);
  padding:20px;animation:pop .26s cubic-bezier(.2,.9,.3,1.2) both;
}
.modal h3{margin:0 0 8px;font-size:17px;font-weight:800}
.toasts{position:fixed;z-index:300;left:50%;transform:translateX(-50%);bottom:18px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
.toast{
  pointer-events:auto;width:100%;
  background:rgba(12,26,24,.93);color:#eafaf3;border-radius:14px;padding:10px 14px;
  font-size:13px;font-weight:700;box-shadow:var(--sh-3);
  display:flex;align-items:center;gap:9px;animation:toastIn .34s cubic-bezier(.2,.9,.3,1.2) both;
}
.toast.out{animation:toastOut .3s ease forwards}
.toast .e{font-size:16px}
.toast.g{background:linear-gradient(100deg,#0d8f6f,#12b48c);color:#fff}
.toast.b{background:linear-gradient(100deg,#2a63df,#4b83f2);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
.xpfly{
  position:fixed;z-index:320;pointer-events:none;font-weight:900;font-size:14px;color:#0a6b53;
  text-shadow:0 1px 0 #fff;animation:fly 1s cubic-bezier(.3,.8,.3,1) forwards;
}
@keyframes fly{to{transform:translate(var(--tx,0),-70px) scale(1.25);opacity:0}}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:820px){
  :root{--topbar:54px}
  .view{padding:14px 10px 104px}
  .dock{display:flex}
  .hud .hideS{display:none}
  .panel{padding:13px;border-radius:18px}
  .hero{padding:16px;border-radius:20px}
  .map{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
  .sta{min-height:132px;padding:12px}
  .blk{grid-template-columns:74px minmax(0,1fr)}
  .attr .k{min-width:88px}
  .inp{font-size:16px}
  textarea.inp{font-size:16px}
}
@media (max-width:560px){
  table.dt{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.dt thead,table.dt tbody{display:table;width:100%}
  .attr{flex-wrap:wrap}
  .attr .k{min-width:100%}
  .attr.flag::after{top:6px}
  .locks{grid-template-columns:minmax(0,1fr)}
  .radar-wrap{justify-content:center}
}
@media (max-width:420px){
  .map{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .brand .bt span{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .gline{stroke-dashoffset:0 !important}
  .gpt{opacity:1 !important}
  .bub{animation:none !important;opacity:.8}
}
</style>

<div class="app">

<script>
/* ============================================================
   0 · CONCEPTS + CONTENT BANK
   ============================================================ */
const CONCEPTS = {
  sci_tech:'Science vs Technology',
  obs:'Observations',
  qual:'Qualitative Data',
  quant:'Quantitative Data',
  inf:'Inference',

  iv:'Independent Variable',
  dv:'Dependent Variable',
  cv:'Controlled Variables',

};

/* ---------- OBSERVATION SCENES (15) ---------- */
const OBS = [
{id:'o1',title:'Tank 1 · Aquatic Plant',place:'Photosynthesis bench · Bay A',
 scene:{kind:'plant',screens:0,bubbles:7,temp:22,leaf:'bent',water:'clear',lamp:100},
 readouts:[['BUBBLE COUNTER','7 per 30 s'],['THERMOMETER','22 °C'],['LAMP','40 W · 100 %'],['SCREEN LAYERS','0'],['SPECIMEN','Elodea · 12 cm']],
 facts:[

 bad:[{kw:[['alive','healthy','happy','thriving']],fb:'“Alive” or “healthy” is a judgement about the plant, not something an instrument on this bench displays.'}]},

 scene:{kind:'plant',screens:3,bubbles:2,temp:21,leaf:'droop',water:'clear',lamp:25},
 readouts:[['BUBBLE COUNTER','2 per 30 s'],['THERMOMETER','21 °C'],['LAMP','40 W · 25 %'],['SCREEN LAYERS','3'],['SPECIMEN','Elodea · 12 cm']],
 facts:[
  {t:'The light reaching the plant looks dim.',k:'q',kw:[['light','lamp'],['dim','dark','faint','low']]},
  {t:'One leaf droops downward.',k:'q',kw:[['leaf','leaves'],['droop','bent','curl','hang','down']]},
  {t:'Only two bubbles formed in 30 seconds.',k:'n',kw:[['2','two'],['bubble']]},

{id:'o3',title:'Beaker 7 · Unknown Liquid',place:'Wet chemistry bench',

 facts:[
  {t:'The liquid is blue.',k:'q',kw:[['liquid','water','solution','sample'],['blue']]},
  {t:'The liquid smells sharp, like vinegar.',k:'q',kw:[['smell','odour','odor','scent'],['sharp','vinegar','sour','strong','acid']]},

  {t:'The liquid contains a blue chemical.',k:'i',kw:[['contain','has','is made','dye','chemical','acid','copper']]},
 ],
 bad:[{kw:[['contains a blue chemical'],['it is blue']],fb:'Careful — “the liquid is blue” is what you see. Saying what is *inside* it is an interpretation.'}]},

{id:'o4',title:'Station Door · Weather',place:'Loading bay, outside',
 scene:{kind:'street',temp:14,puddles:3},
 readouts:[['THERMOMETER','14 °C'],['PUDDLES COUNTED','3'],['SKY','dark grey cloud'],['OBJECTS','umbrella by the door']],
 facts:[
  {t:'The pavement is wet.',k:'q',kw:[['pavement','ground','floor','path','street'],['wet','damp','soaked']]},
  {t:'The clouds are dark grey.',k:'q',kw:[['cloud','sky'],['dark','grey','gray','black','heavy']]},
  {t:'The thermometer reads 14 °C.',k:'n',kw:[['14'],['°c','c','celsius','degree','temp']]},
  {t:'There are three puddles.',k:'n',kw:[['3','three'],['puddle']]},

 bad:[{kw:[['someone spilled','sprinkler']],fb:'That is a possible explanation — which makes it an inference, not an observation. Record what you can see first.'}]},

{id:'o5',title:'Grow Shelf · Two Seedlings',place:'Greenhouse, east shelf',

 facts:[
  {t:"Seedling A's leaves are wide and pale green.",k:'q',kw:[['a'],['leaf','leaves','wide','pale','green']]},
  {t:'The soil in pot B is dry and cracked.',k:'q',kw:[['b'],['soil','dirt'],['dry','crack']]},
  {t:'Seedling A is 12 cm tall.',k:'n',kw:[['12'],['cm','centimeter','centimetre','tall','height']]},
  {t:'Seedling B is 5 cm tall.',k:'n',kw:[['5'],['cm','centimeter','centimetre','tall','height']]},
  {t:'Seedling A received more sunlight.',k:'i',kw:[['a'],['more light','more sunlight','light','sun']]}]},

{id:'o6',title:'Circuit Board 3',place:'Electronics bench',
 scene:{kind:'circuit'},
 readouts:[['AMMETER','0.3 A'],['BATTERIES','2 × 1.5 V'],['BULB','dim orange'],['WIRE','frayed near holder']],
 facts:[

  {t:'The wire insulation is frayed.',k:'q',kw:[['wire','cable','insulation'],['fray','bare','worn','broken','cut']]},

(function(){
'use strict';

/* ---------- tiny DOM/util helpers ---------- */
const U = {
  $:(s,r)=> (r||document).querySelector(s),
  $$:(s,r)=> Array.from((r||document).querySelectorAll(s)),
  esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  el(tag,attrs,kids){
    const n=document.createElement(tag);
    if(attrs) for(const k in attrs){
      const v=attrs[k];
      if(v===null||v===undefined||v===false) continue;
      if(k==='class') n.className=v;
      else if(k==='html') n.innerHTML=v;
      else if(k==='text') n.textContent=v;
      else if(k.slice(0,2)==='on'&&typeof v==='function') n.addEventListener(k.slice(2).toLowerCase(),v);
      else if(k==='style'&&typeof v==='object') Object.assign(n.style,v);
      else n.setAttribute(k,v===true?'':String(v));
    }
    if(kids!==null&&kids!==undefined){
      (Array.isArray(kids)?kids:[kids]).forEach(c=>{
        if(c===null||c===undefined||c===false) return;
        n.appendChild(c.nodeType?c:document.createTextNode(String(c)));
      });
    }
    return n;
  },
  norm(s){
    return String(s||'').toLowerCase()
      .replace(/[’'`]/g,"'").replace(/[°]/g,' ')
      .replace(/[^a-z0-9.\- ']/g,' ')
      .replace(/\s+/g,' ').trim();
  },
  num(s){ const m=String(s||'').replace(/,/g,'').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; },
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  ri:(a,b)=>a+Math.floor(Math.random()*(b-a+1)),
  pick(a){ return a[Math.floor(Math.random()*a.length)]; },
  shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; },
  uid:()=>Math.random().toString(36).slice(2,9),
  reduced(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
};
/* keyword-group matching: groups = [[synonym,...], ...] */
function kwHit(text,group){
  const t=U.norm(text);
  const g=Array.isArray(group)?group:[group];
  return g.some(s=>t.indexOf(U.norm(s))>=0);
}
function kwScore(text,groups){
  let m=0; const missing=[];
  groups.forEach(g=>{ if(kwHit(text,g)) m++; else missing.push(Array.isArray(g)?g[0]:g); });
  return {m,n:groups.length,missing,ok:(m===groups.length)||(groups.length>=3&&m>=groups.length-1)};
}
function hasAny(text,groups){ return (groups||[]).some(g=>kwHit(text,g)); }
function hasWord(text,w){ return new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(String(text||'')); }

});

    s.score=Object.assign(d.score,p&&p.score||{});

    s.campaign=Object.assign(d.campaign,p&&p.campaign||{});

  }catch(e){ return DEF(); }
}

/* ---------- mastery / adaptive ---------- */
const M = {
  rec(c,ok,w){
    if(!c) return;
    const arr=Array.isArray(c)?c:[c];
    arr.forEach(k=>{
      if(!CONCEPTS[k]) return;
      const m=S.mastery[k]||(S.mastery[k]={c:0,t:0,s:50});
      m.t+=1; if(ok) m.c+=1;
      const target=ok?100:0;
      m.s=Math.round(U.clamp(m.s*0.68+target*0.32,0,100));
    });
    save();
  },
  lv(c){ const m=S.mastery[c]; return m?m.s:50; },
  data(c){ return S.mastery[c]||{c:0,t:0,s:50}; },
  /* weighted pick biased toward weak concepts — never punitive, just more practice */
  pick(list){
    if(!list.length) return null;
    const w=list.map(k=>{
      const m=S.mastery[k];
      const tries=m?m.t:0;
      const s=m?m.s:50;
      return {k,w:Math.max(0.35,(100-s)/100*1.5+ (tries<2?0.7:0))};
    });
    const tot=w.reduce((a,b)=>a+b.w,0);
    let r=Math.random()*tot;
    for(const it of w){ r-=it.w; if(r<=0) return it.k; }
    return w[w.length-1].k;
  },
  weakest(list,n){
    return list.slice().sort((a,b)=>M.lv(a)-M.lv(b)).slice(0,n);
  }
};

  hint(){ S.score.hints++; save(); },
  retry(){ S.score.retries++; save(); },
  pct(cat){ const c=S.score[cat]; return c&&c.n?Math.round(100*c.ok/c.n):null; },
  indep(){
    const a=Math.max(6,S.score.acts*1.6);
    return U.clamp(Math.round(100-100*(S.score.hints+S.score.retries*0.5)/a),0,100);
  },
  xp(n,fromEl){
    S.xp+=n; S.energy+=n; save(); syncHUD();
    if(fromEl){
      const f=U.el('div',{class:'xpfly',text:'+'+n+' XP'});
      const r=fromEl.getBoundingClientRect();
      f.style.left=(r.left+r.width/2-20)+'px'; f.style.top=(r.top-6)+'px';
      document.body.appendChild(f);
      setTimeout(()=>f.remove(),1000);
    }
  },
  energy(n){ S.energy+=n; save(); syncHUD(); },
  badge(id){
    if(S.badges[id]||!BADGES[id]) return;
    S.badges[id]=Date.now(); save();
    UI.toast(BADGES[id].e+' Badge earned · '+BADGES[id].n,'g');
  },
  station(id,pts,total){
    const st=S.stations[id]||(S.stations[id]={pts:0,done:0,perfect:0});
    st.pts+=pts;
    if(!S.restored.includes(id)&&st.pts>=total){
      S.restored.push(id); save();
      SC.badge('firstlight');
      UI.toast('⚡ '+STATION_NAME[id]+' is back online','g');
      if(S.restored.length>=STATIONS.length) SC.badge('restored');
    } else save();
  }
};

/* ---------- AI judge ---------- */
const AI_SYS='You are a concise middle-school science answer grader. Evaluate the student response against the supplied rubric only. Accept semantically correct wording even when terminology differs slightly. Do not demand an exact phrase. Do not reward scientifically incorrect claims. Never say a hypothesis is "proven"; use "supported" or "not supported by the evidence". Respond ONLY with strict JSON text, with no markdown, no code fences and no tools.';
const AI={
  bases:['https://osaii.wyernhub.net/api/v1','https://osaii.wyvernhub.net/api/v1'],
  base:null,model:null,state:'idle',
  chip(){ return U.$('#ai-chip'); },
  paint(){
    const c=this.chip(); if(!c) return;
    c.dataset.on=this.state==='online'?'1':'0';
    c.dataset.busy=this.state==='busy'?'1':'0';
    const t=U.$('.txt',c);
    if(t) t.textContent=this.state==='online'?'AI Judge: Online':(this.state==='busy'?'AI Judge…':'Offline Judge');
    c.title=this.state==='online'
      ? 'AI judge online ('+this.model+'). It only reads the text you type; every station also works without it.'
      : 'Offline judge — local deterministic grading is running. The game is fully playable.';
  },
  goodModel(id){
    const s=String(id||'').toLowerCase();
    if(/embed|whisper|tts|dall|image|audio|moderation|rerank|bge|davinci-003|realtime|transcribe|vision-only|clip/i.test(s)) return false;
    return s.length>0;
  },
  rank(id){
    const s=String(id||'').toLowerCase();
    const pref=['gpt-4o','gpt-4.1','gpt-4','claude-3','claude','gemini-1.5','gemini','llama-3','llama','qwen','mistral','deepseek','phi-','grok','kimi','gpt-3.5','gpt','mini','chat'];
    for(let i=0;i<pref.length;i++) if(s.indexOf(pref[i])>=0) return 100-i;
    return 10;
  },
  async init(){
    this.paint();
    const cached=S.ai;
    if(cached&&cached.base&&cached.model&&(Date.now()-(cached.at||0)<1000*60*60*12)){
      this.base=cached.base; this.model=cached.model; this.state='online'; this.paint();
      /* quietly re-verify in the background; drop back to offline if it is gone */
      this.ping().then(ok=>{ if(!ok){ this.state='offline'; this.paint(); } });
      return;
    }
    for(const b of this.bases){
      try{
        const r=await this.fetchJSON(b+'/models',9000);
        if(!r) continue;
        const list=(r.data||r.models||r||[]).map(m=>typeof m==='string'?m:(m.id||m.model||m.name)).filter(Boolean);
        const good=list.filter(id=>this.goodModel(id));
        if(!good.length) continue;
        good.sort((a,b)=>this.rank(b)-this.rank(a));
        this.base=b; this.model=good[0]; this.state='online';
        S.ai={base:b,model:good[0],at:Date.now(),ok:true}; save();
        this.paint();
        return;
      }catch(e){ /* try next host */ }
    }
    this.state='offline'; S.ai.ok=false; save(); this.paint();
  },
  async ping(){
    if(!this.base) return false;
    try{ const r=await this.fetchJSON(this.base+'/models',7000); return !!r; }catch(e){ return false; }
  },
  fetchJSON(url,ms){
    const ctl=new AbortController();
    const t=setTimeout(()=>ctl.abort(),ms||9000);
    return fetch(url,{signal:ctl.signal,headers:{'accept':'application/json'}})
      .then(r=>{ clearTimeout(t); if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .catch(e=>{ clearTimeout(t); throw e; });
  },
  extract(txt){
    const s=String(txt||'');
    const a=s.indexOf('{'), b=s.lastIndexOf('}');
    if(a>=0&&b>a){
      try{ return JSON.parse(s.slice(a,b+1)); }catch(e){}
      const clean=s.slice(a,b+1).replace(/,\s*([}\]])/g,'$1').replace(/[\u201c\u201d]/g,'"');
      try{ return JSON.parse(clean); }catch(e){}
    }
    return null;
  },
  async ask(payload,ms){
    if(this.state==='offline'||!this.base||!this.model) return null;
    const prev=this.state; this.state='busy'; this.paint();
    try{
      const ctl=new AbortController();
      const t=setTimeout(()=>ctl.abort(),ms||11000);
      const r=await fetch(this.base+'/chat/completions',{
        method:'POST',
        headers:{'content-type':'application/json','accept':'application/json'},
        signal:ctl.signal,
        body:JSON.stringify({
          model:this.model,
          temperature:0.2,
          messages:[{role:'system',content:AI_SYS},{role:'user',content:JSON.stringify(payload)}]
        })
      });
      clearTimeout(t);
      if(!r.ok) throw new Error('http '+r.status);
      const j=await r.json();
      const txt=j&&j.choices&&j.choices[0]&&(j.choices[0].message&&j.choices[0].message.content || j.choices[0].text);
      const out=this.extract(txt);
      this.state='online'; this.paint();
      return out;
    }catch(e){
      this.state=prev==='busy'?'offline':prev;
      if(this.state==='busy') this.state='offline';
      this.paint();
      return null;
    }
  }
};
/* Grading gate: local verdict is authoritative when it already passes, so the
   student never waits on the network for something they clearly got right.
   AI is consulted for anything ambiguous or marked wrong (rescue path) and for
   rich rubric feedback, and a failed call can never break the game. */
async function grade(o){
  const local=o.local||{pass:false,score:0,feedback:'',missing:[]};
  if(local.pass&&!o.alwaysAI) return Object.assign({src:'local'},local);
  const payload={concept:o.concept,question:o.question,studentAnswer:o.studentAnswer,rubric:o.rubric};
  if(o.extra) payload.extra=o.extra;
  const v=await AI.ask(payload,o.ms);
  if(!v||typeof v.correct!=='boolean') return Object.assign({src:'local'},local);
  return {src:'ai',pass:!!v.correct,score:typeof v.score==='number'?U.clamp(v.score,0,1):local.score,
    feedback:String(v.feedback||local.feedback||''),missing:Array.isArray(v.missing)?v.missing:[],
    misconception:v.misconception||null,local};
}

/* ---------- pointer drag & drop (mouse + touch) ---------- */
const DND=(function(){
  let cur=null;
  function target(x,y){
    const el=document.elementFromPoint(x,y);
    if(!el) return null;
    return el.closest?el.closest('[data-drop]'):null;
  }
  function mark(t){
    U.$$('[data-drop].over').forEach(n=>{ if(n!==t) n.classList.remove('over'); });
    if(t){
      const ok=!cur||!t.__accept||t.__accept(cur.el.__data);
      t.classList.toggle('over',ok); t.classList.toggle('bad',!ok);
    } else U.$$('[data-drop].bad').forEach(n=>n.classList.remove('bad'));
  }
  function down(e){
    const el=e.currentTarget;
    if(el.hasAttribute('data-locked')) return;
    if(e.pointerType==='mouse'&&e.button!==0) return;
    const r=el.getBoundingClientRect();
    cur={el,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,moved:false,pid:e.pointerId};
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('pointercancel',up);
  }
  function move(e){
    if(!cur) return;
    if(!cur.moved){
      if(Math.abs(e.clientX-cur.sx)<7&&Math.abs(e.clientY-cur.sy)<7) return;
      cur.moved=true;
      const g=cur.el.cloneNode(true);
      g.classList.add('ghost'); g.classList.remove('sel');
      g.style.width=cur.el.offsetWidth+'px';
      document.body.appendChild(g);
      cur.ghost=g; cur.el.classList.add('lifting');
      if(navigator.vibrate) { try{navigator.vibrate(8);}catch(err){} }
    }
    if(e.cancelable) e.preventDefault();
    cur.ghost.style.transform='translate('+(e.clientX-cur.ox)+'px,'+(e.clientY-cur.oy)+'px) rotate(1.2deg) scale(1.03)';
    mark(target(e.clientX,e.clientY));
  }
  function up(e){
    if(!cur) return;
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    const c=cur; cur=null;
    c.el.classList.remove('lifting');
    mark(null);
    if(!c.moved){ tap(c.el); return; }
    const t=target(e.clientX,e.clientY);
    if(t){
      const ok=!t.__accept||t.__accept(c.el.__data);
      if(ok&&t.__drop&&t.__drop(c.el,t)!==false){
        if(c.ghost) c.ghost.remove();
        return;
      }
      t.classList.add('bad'); setTimeout(()=>t.classList.remove('bad'),320);
    }
    const g=c.ghost;
    if(g){
      const r=c.el.getBoundingClientRect();
      g.style.transition='transform .22s cubic-bezier(.2,.8,.3,1)';
      g.style.transform='translate('+r.left+'px,'+r.top+'px)';
      setTimeout(()=>g.remove(),240);
    }
  }
  function tap(el){
    const group=el.getAttribute('data-group')||'g';
    const was=el.classList.contains('sel');
    U.$$('.drag.sel').forEach(n=>{ if((n.getAttribute('data-group')||'g')===group) n.classList.remove('sel'); });
    if(!was){
      el.classList.add('sel');
      const dz=U.$('[data-drop][data-hintsel]');
      if(dz){ dz.classList.add('over'); setTimeout(()=>dz.classList.remove('over'),1400); }
    }
  }
  /* a scope of one node must include that node itself, so freshly created
     drag chips / drop zones passed straight in still get wired */
  function scopeOf(root,sel){
    if(!root||root===document||root.nodeType===9) return U.$$(sel,document);
    const inner=U.$$(sel,root);
    return (root.matches&&root.matches(sel))?[root].concat(inner):inner;
  }
  function bind(root){
    scopeOf(root,'[data-drag]').forEach(el=>{
      if(el.__dndBound) return; el.__dndBound=true;
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
      el.setAttribute('role','button');
      el.addEventListener('pointerdown',down);
      el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); tap(el); } });
    });
    scopeOf(root,'[data-drop]').forEach(el=>{
      if(el.__dndClick) return; el.__dndClick=true;
      el.addEventListener('click',()=>{
        const sel=U.$$('.drag.sel').filter(n=>el.contains(n)===false);
        if(!sel.length) return;
        const first=sel[0];
        const ok=!el.__accept||el.__accept(first.__data);
        if(ok&&el.__drop&&el.__drop(first,el)!==false) sel.forEach(n=>n.classList.remove('sel'));
        else { el.classList.add('bad'); setTimeout(()=>el.classList.remove('bad'),320); }
      });
      el.addEventListener('keydown',ev=>{
        if(ev.key!=='Enter') return;
        const sel=U.$$('.drag.sel')[0]; if(!sel) return;
        if(el.__drop&&el.__drop(sel,el)!==false) sel.classList.remove('sel');
      });
    });
  }
  function dragNode(label,data,opts){
    opts=opts||{};
    const n=U.el('div',{class:'drag'+(opts.cls?' '+opts.cls:''),'data-drag':'1','data-group':opts.group||'g'});
    n.innerHTML='<span class="grip">⋮⋮</span><span>'+label+'</span>';
    n.__data=data||{};
    return n;
  }
  function dropNode(el,fn,opts){
    opts=opts||{};
    el.setAttribute('data-drop','1');
    if(opts.hintsel) el.setAttribute('data-hintsel','1');
    el.__drop=fn; if(opts.accept) el.__accept=opts.accept;
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    return el;
  }
  return {bind,dragNode,dropNode,get current(){return cur;}};
})();

/* ---------- UI helpers ---------- */
const UI={
  toast(msg,tone){
    const root=U.$('#toast-root'); if(!root) return;
    const t=U.el('div',{class:'toast'+(tone?' '+tone:'')});
    t.innerHTML=msg;
    root.appendChild(t);
    setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),320); },2600);
    while(root.children.length>3) root.firstChild.remove();
  },
  modal(o){
    const root=U.$('#modal-root');
    const scrim=U.el('div',{class:'scrim'});
    const box=U.el('div',{class:'modal',role:'dialog','aria-modal':'true'});
    if(o.title) box.appendChild(U.el('h3',{html:o.title}));
    if(o.body) box.appendChild(typeof o.body==='string'?U.el('div',{html:o.body}):o.body);
    if(o.actions&&o.actions.length){
      const r=U.el('div',{class:'row end',style:{marginTop:'16px'}});
      o.actions.forEach(a=>r.appendChild(U.el('button',{class:'btn '+(a.cls||'q'),onclick:()=>{ if(a.fn&&a.fn()!==false) close(); },text:a.label})));
      box.appendChild(r);
    }
    scrim.appendChild(box);
    scrim.addEventListener('click',e=>{ if(e.target===scrim&&o.dismissible!==false) close(); });
    function close(){ scrim.remove(); document.removeEventListener('keydown',esc); }
    function esc(e){ if(e.key==='Escape') close(); }
    document.addEventListener('keydown',esc);
    root.appendChild(scrim);
    const f=box.querySelector('input,textarea,button'); if(f) setTimeout(()=>f.focus(),60);
    return {close,box};
  },
  feed(tone,html,extra){
    const ic={good:'✓',bad:'!',warn:'⚠',info:'i'}[tone]||'i';
    const n=U.el('div',{class:'feed '+tone});
    n.innerHTML='<span class="ic">'+ic+'</span><div class="bd">'+html+(extra||'')+'</div>';
    return n;
  },
  clear(n){ while(n&&n.firstChild) n.removeChild(n.firstChild); },
  judging(){ return U.el('div',{class:'judging',html:'<span class="sp"></span> Judge reading your answer…'}); }
};

  function build(host,spec,opts){
    opts=opts||{};
    spec=spec||{kind:'plant'};
    const kind=(spec.kind&&K[spec.kind])?spec.kind:'plant';
    const stage=U.el('div',{class:'stage'});
    stage.innerHTML=K[kind](spec);
    const area=BUBAREA[kind];
    const wrap=U.el('div',{class:'bubwrap'});
    let bub=null;
    if(area){
      bub=U.el('div',{style:{position:'absolute',left:area.l+'%',top:area.t+'%',width:area.w+'%',height:area.h+'%'}});
      wrap.appendChild(bub);
    }
    stage.appendChild(wrap);
    const glow=U.el('div',{class:'lampglow',style:{left:'42%',top:'6%',width:'16%',height:'14%',background:'radial-gradient(circle,rgba(255,214,120,.85),rgba(255,214,120,0) 70%)'}});
    stage.appendChild(glow);
    const scr=U.el('div',{class:'screens',style:{left:'45%',top:'22%',width:'10%',height:'12%',display:'none'}});
    stage.appendChild(scr);
    const ro=U.el('div',{class:'readout'});
    stage.appendChild(ro);
    host.appendChild(stage);

    const api={
      el:stage,
      readouts(list){
        UI.clear(ro);
        (list||[]).forEach(r=>ro.appendChild(U.el('div',{class:'rd',html:'<b>'+U.esc(r[0])+'</b> '+U.esc(r[1])})));
      },
      light(p){
        p=U.clamp(p==null?100:p,0,100)/100;
        glow.style.opacity=String(0.12+p*0.9);
        glow.style.transform='scale('+(0.7+p*0.8)+')';
        const cone=U.$('.cone',stage), face=U.$('.bulbface',stage);
        if(cone) cone.setAttribute('opacity',String(0.03+p*0.3));
        if(face) face.setAttribute('fill',p>0.15?'#ffdc85':'#8b8f86');
      },
      screens(n){
        n=U.clamp(n||0,0,4);
        if(!n){ scr.style.display='none'; UI.clear(scr); return; }
        scr.style.display='flex'; UI.clear(scr);
        for(let i=0;i<n;i++) scr.appendChild(U.el('i'));
      },
      bubble(count,ms){
        if(!bub) return 0;
        count=count==null?1:count;
        if(U.reduced()){
          /* still show every bubble that was produced — just parked, not rising */
          for(let i=0;i<count;i++){
            const b=U.el('div',{class:'bub'});
            const sz=4+((i*37)%7);
            b.style.width=sz+'px'; b.style.height=sz+'px';
            b.style.left=(6+((i*29)%84))+'%';
            b.style.bottom=(4+((i*23)%68))+'%';
            bub.appendChild(b);
          }
          return count;
        }
        for(let i=0;i<count;i++){
          const b=U.el('div',{class:'bub'});
          const s=4+Math.random()*7;
          b.style.width=s+'px'; b.style.height=s+'px';
          b.style.left=(Math.random()*88)+'%';
          b.style.setProperty('--h','-'+(60+Math.random()*80)+'px');
          b.style.setProperty('--dx',(Math.random()*22-11)+'px');
          b.style.animationDuration=(ms||1500+Math.random()*900)+'ms';
          b.style.animationDelay=(i*(ms?ms/count:260))+'ms';
          bub.appendChild(b);
          setTimeout(()=>b.remove(),(ms||2400)+i*(ms?ms/count:260)+400);
        }
        return count;
      },
      /* one bubble per unit of rate, spread across the window */
      stream(rate,secs){
        if(!bub) return;
        api.stop();
        api._t=[];
        const per=U.reduced()?0:rate;
        for(let i=0;i<per;i++){
          api._t.push(setTimeout(()=>api.bubble(1,Math.min(2400,secs*1000/rate)),(i/rate)*secs*1000));
        }
      },
      stop(){ (api._t||[]).forEach(clearTimeout); api._t=[]; },
      warn(msg){
        const old=U.$('.warnlight',stage); if(old) old.remove();
        if(!msg) return;
        const w=U.el('div',{class:'warnlight',text:msg});
        stage.appendChild(w);
        return w;
      }
    };
    api.light(spec.lamp==null?100:spec.lamp);
    api.screens(spec.screens||0);
    if(opts.readouts) api.readouts(opts.readouts);
    return api;
  }
  return {build,kinds:Object.keys(K)};

/* ============================================================

   ============================================================ */
const TRAYKIND={q:{n:'Qualitative data',c:'q',hint:'descriptive — colour, texture, smell, shape'},
  n:{n:'Quantitative data',c:'n',hint:'a number you measured or counted'},
  i:{n:'Inferences',c:'i',hint:'an explanation built from evidence + prior knowledge'}};
const HINTS=[
  'Could you directly see, smell or measure that on this bench — or did you work it out?',
  'Does your sentence explain <b>why</b> something happened rather than report <b>what</b> happened?',
  'Compare: <i>“The liquid is blue”</i> reports what you see. <i>“The liquid contains a blue chemical”</i> explains it. One of those is an inference.'
];
function viewObservation(host,params){
  const st=stById('obs');
  const order=params&&params.id?[OBS.filter(o=>o.id===params.id)[0]].filter(Boolean):U.shuffle(OBS).filter(o=>!S.seen[o.id]);
  const scene=(order[0])||U.pick(OBS);
  const used={},attempts={},revealed={};
  let placed=0,wrong=0,hintsUsed=0;

  const {body}=shell(host,st,{title:scene.title,sub:scene.place+' · write what you observe, then sort it into the right tray.',steps:['Read the bench','Write a statement','Sort it','Debrief'],active:1});
  const cols=U.el('div',{class:'cols'});
  const left=U.el('div',{class:'panel solid'});
  const right=U.el('div',{style:{display:'grid',gap:'12px'}});
  cols.appendChild(left); cols.appendChild(right); body.appendChild(cols);

  const app=APP.build(left,scene.scene,{readouts:scene.readouts});
  left.appendChild(U.el('div',{class:'panel-h',style:{marginTop:'12px',marginBottom:'6px'},html:'<h3>Bench readouts</h3><span class="sub">instruments only</span>'}));
  const rl=U.el('div',{style:{display:'grid',gap:'5px'}});
  scene.readouts.forEach(r=>rl.appendChild(U.el('div',{class:'tiny mono',html:'<b style="color:var(--ink2)">'+U.esc(r[0])+'</b> · '+U.esc(r[1])})));
  left.appendChild(rl);
  left.appendChild(U.el('div',{class:'divider'}));
  left.appendChild(U.el('p',{class:'tiny',html:'Write <b>one</b> statement at a time. Then drag the card into the tray it belongs in. Tapping a card then tapping a tray works on a phone.'}));

  /* progress + input */
  const prog=U.el('div',{class:'panel solid'});
  prog.innerHTML='<div class="panel-h"><h3>Field notes</h3><span class="sub" id="cnt">0 / '+scene.facts.length+' recorded</span></div>';
  const field=U.el('div',{class:'field'});
  const inp=U.el('input',{class:'inp',placeholder:'e.g. “Seven bubbles formed in 30 seconds.”','aria-label':'Write an observation'});
  const mk=U.el('button',{class:'btn b sm',text:'Make a card'});
  field.appendChild(U.el('label',{text:'Write one statement about this bench'}));
  field.appendChild(inp);
  prog.appendChild(field);
  const stageArea=U.el('div',{class:'rack',style:{marginTop:'10px',minHeight:'44px'}});
  prog.appendChild(stageArea);
  const row=U.el('div',{class:'row',style:{marginTop:'10px'}});
  row.appendChild(mk);
  const hintBtn=U.el('button',{class:'btn q sm',text:'I’m stuck'});
  row.appendChild(hintBtn);
  prog.appendChild(row);
  const fb=U.el('div',{style:{marginTop:'10px',display:'grid',gap:'8px'}});
  prog.appendChild(fb);
  right.appendChild(prog);

  /* trays */
  const trays=U.el('div',{class:'trays'});
  const trayEls={};
  ['q','n','i'].forEach(k=>{
    const t=U.el('div',{class:'tray '+TRAYKIND[k].c});
    t.innerHTML='<div class="th"><b>'+TRAYKIND[k].n+'</b><span class="n"></span></div><div class="tiny" style="margin:-4px 0 4px">'+TRAYKIND[k].hint+'</div>';
    const items=U.el('div',{class:'items'});
    t.appendChild(items);
    trayEls[k]={root:t,items};
    DND.dropNode(t,(el)=>place(el,k),{accept:()=>true,hintsel:true});
    trays.appendChild(t);
  });
  right.appendChild(trays);

  const note=U.el('div',{class:'panel solid'});
  note.innerHTML='<div class="panel-h"><h3>Why the split matters</h3></div>'
   +'<p class="tiny">An <b>observation</b> uses the senses or an instrument. An <b>inference</b> is a logical interpretation built on observations <i>and</i> prior knowledge — reasonable, but not the same thing as seeing it. Quantitative data compares more precisely than qualitative data.</p>';
  right.appendChild(note);

  function refreshCount(){
    const c=U.$('#cnt',prog);
    if(c) c.textContent=placed+' / '+scene.facts.length+' recorded';
    ['q','n','i'].forEach(k=>{
      const n=trayEls[k].items.children.length;
      const s=U.$('.n',trayEls[k].root); if(s) s.textContent=n?n+' placed':'';
    });
  }
  function say(tone,html){
    fb.insertBefore(UI.feed(tone,html),fb.firstChild);
    while(fb.children.length>3) fb.lastChild.remove();
  }
  function makeCard(text){
    const card=DND.dragNode(U.esc(text),{text},{group:'obs'});
    card.__text=text;
    card.__tries=0;
    const rm=U.el('button',{class:'btn q sm',style:{marginLeft:'auto',minHeight:'24px',padding:'0 7px',fontSize:'11px'},text:'×','aria-label':'Discard'});
    rm.onclick=e=>{e.stopPropagation();card.remove();};
    card.appendChild(rm);
    stageArea.appendChild(card);
    DND.bind(card);
    inp.value=''; inp.focus();
  }
  mk.onclick=()=>{
    const v=(inp.value||'').trim();
    if(v.length<4){ inp.classList.add('err'); setTimeout(()=>inp.classList.remove('err'),600); UI.toast('Write a full statement first.'); return; }
    makeCard(v);
  };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); mk.onclick(); } });
  hintBtn.onclick=()=>{
    hintsUsed++; SC.hint();
    const h=U.clamp(hintsUsed-1,0,2);
    say('info','<b>Hint '+Math.min(hintsUsed,3)+':</b> '+HINTS[h]+(hintsUsed>3?'<div class="fx tiny">Look at the readouts: a <b>number</b> belongs with quantitative data, a <b>description</b> with qualitative, and a <b>reason</b> with inferences.</div>':''));
  };

  function place(card,kind){
    const text=card.__text||'';
    const t=U.norm(text);
    if(t.length<5){ say('warn','That is too short to judge. Write a full sentence about one thing you can see or measure.'); return false; }
    /* match against the scene facts */
    let best=null,bs=0;
    scene.facts.forEach((f,i)=>{
      const sc=kwScore(t,f.kw);
      const v=sc.m/sc.n;
      if(v>bs){bs=v;best={f,i,sc};}
    });
    const matched=best&&bs>=0.6;
    if(matched&&used[best.i]){
      say('info','You already recorded that one. Try a different part of the bench.');
      return false;
    }
    if(matched){
      const f=best.f;
      if(f.k===kind){
        used[best.i]=true; placed++;
        const card2=U.el('div',{class:'chipnote ok pop',html:'<span class="m">✓</span><span>'+U.esc(text)+'</span>'});
        trayEls[kind].items.appendChild(card2);
        card.remove();
        const label={q:'qualitative observation',n:'quantitative observation',i:'inference'}[f.k];
        say('good','<b>Filed as a '+label+'.</b> '+(f.k==='i'
          ? 'It goes beyond what the instruments show — it interprets the evidence, which is exactly what an inference does.'
          : (f.k==='n'?'A number like this can be compared precisely, which is why quantitative data is so useful.':'A description like this is qualitative: it captures a characteristic, not a measurement.')));
        SC.rec(f.k==='i'?'evidence':'accuracy',true);
        M.rec(['obs',f.k==='q'?'qual':(f.k==='n'?'quant':'inf')],true);
        SC.xp(10,card2);
        SC.station('obs',10,st.goal);
        refreshCount();
        checkDone();
        return true;
      }
      /* right statement, wrong tray → progressive hints, never the answer */
      attempts[best.i]=(attempts[best.i]||0)+1;
      card.__tries=(card.__tries||0)+1;
      wrong++;
      SC.rec('accuracy',false); SC.retry();
      M.rec(f.k==='q'?'qual':(f.k==='n'?'quant':'inf'),false);
      const a=attempts[best.i];
      if(a>=3){
        revealed[best.i]=true; used[best.i]=true; placed++;
        const c2=U.el('div',{class:'chipnote ok',html:'<span class="m">→</span><span><i>'+U.esc(f.t)+'</i></span>'});
        trayEls[f.k].items.appendChild(c2);
        card.remove();
        say('warn','<b>Filed for you this time.</b> “'+U.esc(f.t)+'” belongs with <b>'+TRAYKIND[f.k].n.toLowerCase()+'</b>. '+
          (f.k==='i'?'It answers <i>why</i>, and it needs prior knowledge — that makes it an inference.':'It reports what the bench shows, without explaining anything — that keeps it an observation.'));
        refreshCount(); checkDone();
        return true;
      }
      const h=U.clamp(a-1,0,2);
      say(a>=2?'warn':'bad',HINTS[h]+'<div class="fx tiny">Nothing was revealed — try the tray again, or rewrite the sentence.</div>');
      return false;
    }
    /* unmatched */
    const badHit=(scene.bad||[]).filter(b=>kwScore(t,b.kw).m>=1)[0];
    if(badHit){ say('warn',badHit.fb); SC.rec('accuracy',false); SC.retry(); return false; }
    if(/\b(because|so that|means|must be|probably|therefore|that's why)\b/.test(t)){
      say('info','That sentence is doing some explaining, which is fine — but I cannot match it to this bench. Ground it in something the readouts actually show, then decide whether it is evidence or interpretation.');
    } else {
      say('bad','I can’t find that on this bench. Pick one instrument reading or one visible detail and describe <b>only</b> that.');
    }
    SC.rec('accuracy',false); SC.retry();
    return false;
  }

  function checkDone(){
    if(placed<Math.max(3,scene.facts.length-1)) return;
    const acc=Math.round(100*placed/(placed+wrong));
    const debrief=U.el('div',{class:'panel solid'});
    debrief.innerHTML='<div class="panel-h"><h3>Debrief · '+U.esc(scene.title)+'</h3></div>'
      +'<table class="dt"><thead><tr><th>Statement</th><th>Type</th><th>You</th></tr></thead><tbody>'
      + scene.facts.map(f=>'<tr><td>'+U.esc(f.t)+'</td><td><span class="tag '+(f.k==='i'?'a':(f.k==='n'?'b':'g'))+'">'+({q:'Qualitative',n:'Quantitative',i:'Inference'})[f.k]+'</span></td><td>'+(used[scene.facts.indexOf(f)]?(revealed[scene.facts.indexOf(f)]?'revealed':'recorded'):'missed')+'</td></tr>').join('')
      +'</tbody></table>'
      +'<div style="margin-top:12px" class="row between"><span class="tiny">Accuracy on this bench: <b>'+acc+'%</b>'+(hintsUsed?' · hints used: '+hintsUsed:'')+'</span></div>'
      +'<div class="row" style="margin-top:12px"><button class="btn p" data-n>Next bench →</button><button class="btn q" data-m>Lab map</button></div>';
    body.appendChild(debrief);
    S.seen[scene.id]=true; save();
    if(acc>=90) SC.station('obs',20,st.goal);
    if(acc>=90&&wrong===0) SC.badge('detective');
    SC.xp(20,debrief);
    debrief.querySelector('[data-n]').onclick=()=>viewObservation(host);
    debrief.querySelector('[data-m]').onclick=()=>go('home');
    debrief.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
  }
  DND.bind(body);
  refreshCount();
  setTimeout(()=>inp.focus(),120);
}

      f.insertBefore(UI.judging(),f.firstChild);

function bars(n){
  let h='<span class="bars">';
  for(let i=0;i<5;i++) h+='<i class="'+(i<n?(n>=4?'on':'mid'):'')+'"></i>';
  return h+'</span>';
}
function scoreHypo(ifT,thenT,becT,p){
  const g=o=>Array.isArray(o)?o:((o&&o.kw)||[]);
  const iv=kwScore(ifT,g(p.iv)), dv=kwScore(thenT,g(p.dv)), rs=kwScore(becT,g(p.reason));
  const ivName=(p.iv&&p.iv.label)||'the factor being changed';
  const dvName=(p.dv&&p.dv.label)||'the outcome being measured';
  const rName=(g(p.reason)[0]&&g(p.reason)[0][0])||'the mechanism';
  const dir=/\b(increase|decrease|more|less|fewer|faster|slower|higher|lower|longer|shorter|greater|smaller|rise|fall|drop|up|down)\b/i.test(thenT);
  const meas=/(\bcm\b|ml|°?c\b|\bg\b|second|minute|per |count|number|bpm|mass|height|time|rate|distance|volume|temperature|words)/i.test(thenT)||/\d/.test(thenT);
  const vague=/\b(better|worse|good|bad|nice|happy|healthier|stuff|things|more)\b/i.test(thenT)&&!meas;
  const banned=/\b(prove|proven|proves|always|never)\b/i.test(ifT+' '+thenT);
  const ifOk=ifT.trim().length>8, thenOk=thenT.trim().length>8, becOk=becT.trim().length>10;
  const testable=(ifOk&&thenOk&&!vague&&!banned)?5:((ifOk&&thenOk)?3:1);
  const variables=(iv.m>=1&&dv.m>=1)?5:((iv.m>=1||dv.m>=1)?3:0);
  const prediction=(dv.m>=1&&dir&&(meas||/\d/.test(thenT)))?5:((dv.m>=1&&dir)?4:((dir||dv.m>=1)?2:0));
  const reasoning=!becOk?0:(rs.m>=1?(rs.m===rs.n?5:4):(becOk?2:0));
  const notes=[];
  if(!ifOk) notes.push('The IF clause needs a factor you could deliberately change.');
  else if(iv.m===0) notes.push('Your IF clause does not name the variable being changed here ('+ivName+').');
  if(!thenOk) notes.push('The THEN clause needs a predicted result.');
  else if(dv.m===0) notes.push('Your THEN clause does not name the thing you would measure ('+dvName+').');
  if(!dir) notes.push('Predict a direction — will it go up or down?');
  if(vague) notes.push('Words like “better” cannot be graphed. Pick a measurable outcome.');
  if(banned) notes.push('A hypothesis is never “proven”; it is supported or not supported by the evidence.');
  if(!becOk) notes.push('The BECAUSE clause needs your scientific reasoning.');
  else if(rs.m===0) notes.push('Your reasoning does not yet mention the mechanism ('+rName+').');
  return {testable,variables,prediction,reasoning,notes,
    pass:testable>=3&&variables>=4&&prediction>=4&&reasoning>=3};
}
