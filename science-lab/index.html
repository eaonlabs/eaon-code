      +['Testable','Variables','Prediction','Reasoning'].map((k,i)=>{
        const v=[s.testable,s.variables,s.prediction,s.reasoning][i];
        return '<div class="rub"><span class="nm">'+k+'</span>'+bars(v)+'<span class="vl mono">'+v+'/5</span></div>';
      }).join('')
      +'</div>'
      +'<div style="margin-top:10px">'+(s.feedback?UI.feed(s.pass?'good':'warn',U.esc(s.feedback)).outerHTML:'')+'</div>'
      +(s.notes&&s.notes.length?'<div style="margin-top:8px"><div class="tiny" style="font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px">To improve</div>'
        +s.notes.map(n=>'<div class="tiny">• '+U.esc(n)+'</div>').join('')+'</div>':'');
    out.insertBefore(card,out.firstChild);
    return card;
  }
  async function run(){
    const ifT=fields.if.value.trim(), thenT=fields.then.value.trim(), becT=fields.bec.value.trim();
    if(!ifT||!thenT){ UI.toast('A hypothesis needs at least the IF and THEN parts.'); return; }
    tries++;
    const s=scoreHypo(ifT,thenT,becT,p);
    const full='If '+ifT+', then '+thenT+(becT?', because '+becT:'')+'.';
    s.feedback=s.pass
      ? 'That is a testable hypothesis. It names the factor being changed, predicts a measurable result and gives a reason.'
      : 'Not forgeable yet — a lab could not test this as written.';
    const card=renderScore(s,'local');
    /* AI refines the wording critique; the local verdict already gates progress */
    grade({concept:'hypothesis',question:p.phen,studentAnswer:full,alwaysAI:true,ms:8000,
      rubric:['testable','identifies the variable being changed','predicts a measurable dependent variable','reasoning is scientifically sound','is not merely an observation restated'],
      local:{pass:s.pass,feedback:s.feedback,score:(s.testable+s.variables+s.prediction+s.reasoning)/20}})
      .then(res=>{ if(res.src==='ai'&&res.feedback){ card.querySelector('.panel-h .sub').textContent='AI judge';
        const f=card.querySelector('.feed'); if(f) f.querySelector('.bd').innerHTML='<b>'+(s.pass?'Accepted.':'Needs work.')+'</b> '+U.esc(res.feedback);
        if(res.misconception) card.appendChild(UI.feed('warn','<b>Watch out:</b> '+U.esc(res.misconception)));
      } });
    if(s.pass){
      SC.rec('accuracy',true); M.rec('hypo',true); SC.xp(24,card); SC.station('hypo',24,st.goal);
      S.seen[p.id]=true; save();
      const done=U.el('div',{class:'panel solid',style:{marginTop:'12px'}});
      done.innerHTML='<div class="panel-h"><h3>Hypothesis accepted</h3></div>'
        +'<p class="tiny" style="font-style:italic">“'+U.esc(full)+'”</p>'
        +'<p class="tiny" style="margin-top:8px">Next, a controlled experiment would change <b>'+U.esc(p.iv.label)+'</b>, measure <b>'+U.esc(p.dv.label)+'</b>, and hold everything else constant. The evidence would then either support this hypothesis or fail to support it.</p>'
        +'<div class="row" style="margin-top:12px"><button class="btn p" data-n>Next phenomenon →</button><button class="btn b" data-w>Wire this in the rig →</button><button class="btn q" data-m>Lab map</button></div>';
      body.appendChild(done);
      done.querySelector('[data-n]').onclick=()=>viewHypothesis(host);
      done.querySelector('[data-w]').onclick=()=>go('s/wire');
      done.querySelector('[data-m]').onclick=()=>go('home');
      done.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
    } else {
      SC.rec('accuracy',false); SC.retry(); M.rec('hypo',false);
    }
  }
  forgeBtn.onclick=run;
  improveBtn.onclick=()=>{
    const s=scoreHypo(fields.if.value,fields.then.value,fields.bec.value,p);
    renderScore(s,'local');
    out.insertBefore(UI.feed('info','Nothing is marked wrong here — a hypothesis is a draft you sharpen. Address the notes above and forge it again.'),out.firstChild);
  };
  hintBtn.onclick=()=>{
    hints++; SC.hint();
    out.insertBefore(UI.feed('info','<b>Hint:</b> IF names something <i>you</i> change. THEN names something you <i>measure</i>, with a direction. BECAUSE names the mechanism.'
      +(hints>1?'<div class="fx tiny">Shape: <i>If the '+U.esc(p.iv.label)+' increases, then the '+U.esc(p.dv.label)+' will …, because …</i></div>':'')),out.firstChild);
  };
  DND.bind(body);
}

/* ============================================================
   8 · MODE 6 — VARIABLE WIRING
   ============================================================ */
let WIRE_PERFECT=0;
function viewWiring(host,params){
  const st=stById('wire');
  const pool=U.shuffle(WIRE).filter(w=>!S.seen[w.id]);
  const w=(params&&params.id?WIRE.filter(x=>x.id===params.id)[0]:null)||pool[0]||U.pick(WIRE);
  let misfires=0,hints=0;
  const placed={iv:null,dv:null,cv:[]};
  const {body}=shell(host,st,{title:'Wire the rig',sub:w.q,steps:['Read the question','Wire','Power on','Explain'],active:1});
  const cols=U.el('div',{class:'cols'});
  const left=U.el('div',{class:'panel solid'}), right=U.el('div',{style:{display:'grid',gap:'12px'}});
  cols.appendChild(left); cols.appendChild(right); body.appendChild(cols);
  const app=APP.build(left,w.scene,{readouts:[['RESEARCH QUESTION',w.q.slice(0,28)+'…']]});
  left.appendChild(U.el('div',{class:'divider'}));
  left.appendChild(U.el('p',{class:'tiny',html:'<b>Research question:</b> '+U.esc(w.q)}));
  left.appendChild(U.el('p',{class:'tiny',style:{marginTop:'6px'},html:'Every component below is real lab kit. Three sockets need filling. Instruments are how you measure — they are not variables, so they can stay on the bench.'}));
  const rackPanel=U.el('div',{class:'panel solid',style:{marginTop:'12px'}});
  rackPanel.appendChild(U.el('div',{class:'panel-h',html:'<h3>Lab components</h3><span class="sub">drag to a socket</span>'}));
  const rack=U.el('div',{class:'rack'});
  rackPanel.appendChild(rack);
  left.appendChild(rackPanel);

  const mach=U.el('div',{class:'machine'});
  mach.innerHTML='<svg viewBox="0 0 400 90" style="width:100%;display:block">'
    +'<rect x="8" y="14" width="384" height="62" rx="14" fill="#eef2f1" stroke="#c2d0cc" stroke-width="2"/>'
    +'<circle class="core" cx="200" cy="45" r="16" fill="#dfe7e5" stroke="#a9bcb8" stroke-width="2"/>'
    +'<path d="M196 39l8 6-8 6z" fill="#8fa3a0"/>'
    +'<path class="wire w1" d="M70 45h110" stroke="#a9bcb8" stroke-width="3" fill="none"/>'
    +'<path class="wire w2" d="M220 45h110" stroke="#a9bcb8" stroke-width="3" fill="none"/>'
    +'<text x="20" y="84" font-size="9" fill="#8b9c98" font-family="ui-monospace,monospace">VARIABLE MACHINE · STANDBY</text></svg>';
  right.appendChild(mach);

  const sockets=U.el('div',{class:'sockets',style:{marginTop:'12px'}});
  const cell={};
  const add=(k,title,sub)=>{
    const s=U.el('div',{class:'sock'}); s.setAttribute('data-k',k);
    s.innerHTML='<div class="sh"><span class="d"></span><b>'+title+'</b></div><div class="tiny">'+sub+'</div>';
    const inn=U.el('div',{class:'in',style:{marginTop:'8px'}});
    s.appendChild(inn);
    cell[k]={root:s,in:inn};
    DND.dropNode(s,(el)=>wire(el,k),{accept:()=>true,hintsel:k!=='cv'});
    sockets.appendChild(s);
  };
  add('iv','Manipulate','the factor you deliberately change');
  add('dv','Measure','the outcome you record in response');
  add('cv','Keep constant','everything else that must stay the same');
  right.appendChild(sockets);
  const fb=U.el('div',{style:{display:'grid',gap:'8px',marginTop:'12px'}});
  right.appendChild(fb);
  function say(t,h){ fb.insertBefore(UI.feed(t,h),fb.firstChild); while(fb.children.length>4) fb.lastChild.remove(); }

  const bench=U.el('div',{class:'rack'});
  const comps=[];
  comps.push({id:w.iv.id,label:w.iv.l,role:'iv'});
  comps.push({id:w.dv.id,label:w.dv.l,role:'dv'});
  w.cvs.forEach(c=>comps.push({id:c.id,label:c.l,role:'cv'}));
  (w.tools||[]).forEach(t=>comps.push({id:t.id,label:t.l,role:'tool'}));
  if(w.trap) comps.push({id:w.trap.id,label:w.trap.l,role:'trap'});
  U.shuffle(comps).forEach(c=>{
    const n=DND.dragNode(U.esc(c.label),{id:c.id,role:c.role,label:c.label},{group:'wire'});
    bench.appendChild(n);
  });
  rackPanel.appendChild(U.el('div',{class:'divider'}));
  rackPanel.appendChild(U.el('div',{class:'tiny',style:{marginBottom:'6px'},text:'On the bench (instruments are fine to leave here):'}));
  rackPanel.appendChild(bench);
  rack.remove();

  const hintBtn=U.el('button',{class:'btn q sm',style:{marginTop:'12px'},text:'I’m stuck'});
  right.appendChild(hintBtn);
  hintBtn.onclick=()=>{
    hints++; SC.hint();
    say('info','<b>Hint:</b> the <b>independent variable</b> is the one factor the experimenter <i>deliberately</i> changes — not simply “the thing that changes”, because plenty of things change. The <b>dependent variable</b> is the outcome measured <i>in response</i> to it.'
      +(hints>1?'<div class="fx tiny">In this question the factor being changed is “'+U.esc(w.iv.l)+'” and the outcome being measured is “'+U.esc(w.dv.l)+'”.</div>':''));
  };

  function wire(el,k){
    const d=el.__data;
    const comp=comps.filter(c=>c.id===d.id)[0];
    if(!comp) return false;
    if(comp.role==='trap'){ say('warn',w.trap.fb); misfires++; SC.rec('accuracy',false); SC.retry(); return false; }
    if(k==='iv'&&comp.role!=='iv'){
      if(comp.role==='dv') say('bad','Your answer identifies something being <b>measured</b>. Remember: the independent variable is the factor the scientist <b>deliberately changes</b>.');
      else if(comp.role==='tool') say('bad','“'+U.esc(comp.label)+'” is an instrument. It helps you measure; it is not a condition you set differently between trials.');
      else say('bad','That is a condition you keep identical in every trial. The independent variable is the one factor the scientist <b>deliberately changes</b> — and in this question that factor is the thing the research question is about.');
      misfires++; SC.rec('accuracy',false); SC.retry(); M.rec('iv',false);
      return false;
    }
    if(k==='dv'&&comp.role!=='dv'){
      if(comp.role==='iv') say('bad','That is the factor you change on purpose. The dependent variable is the outcome you <b>measure in response</b> to it.');
      else if(comp.role==='tool') say('bad','The instrument is not the result. What number does this question actually want at the end?');
      else say('bad','That belongs with the conditions you hold constant. The dependent variable is the outcome you measure <b>in response</b> to the change.');
      misfires++; SC.rec('accuracy',false); SC.retry(); M.rec('dv',false);
      return false;
    }
    if(k==='cv'&&(comp.role==='iv'||comp.role==='dv')){
      say('warn','“'+U.esc(comp.label)+'” is one of the two things this experiment is <i>about</i> — it cannot also be held constant.');
      misfires++; SC.rec('accuracy',false); SC.retry();
      return false;
    }
    /* accept */
    const slot=cell[k].in;
    const existing=U.$('.drag',slot);
    if(existing&&k!=='cv') bench.appendChild(existing);
    const node=DND.dragNode(U.esc(comp.label),{id:comp.id,role:comp.role,label:comp.label},{group:'wire'});
    slot.appendChild(node); DND.bind(node);
    cell[k].root.classList.add('filled');
    if(k==='iv'){ placed.iv=comp; say('good','<b>Manipulate:</b> '+U.esc(comp.label)+'. This is the independent variable — the one factor you set differently on purpose.'); SC.rec('accuracy',true); M.rec('iv',true); }
    if(k==='dv'){ placed.dv=comp; say('good','<b>Measure:</b> '+U.esc(comp.label)+'. This is the dependent variable — the outcome recorded in response.'); SC.rec('accuracy',true); M.rec('dv',true); }
    if(k==='cv'){
      placed.cv=placed.cv.filter(c=>c.id!==comp.id); placed.cv.push(comp);
      say(comp.role==='tool'?'info':'good', comp.role==='tool'
        ? '<b>Instrument parked.</b> “'+U.esc(comp.label)+'” is how you measure, not a variable to control.'
        : '<b>Held constant.</b> Keeping “'+U.esc(comp.label)+'” identical across trials is what makes the comparison fair.');
      SC.rec('accuracy',comp.role!=='tool'); if(comp.role!=='tool') M.rec('cv',true);
    }
    SC.xp(6,node); SC.station('wire',6,st.goal);
    power();
    return true;
  }
  function power(){
    const needCV=w.cvs.length;
    const ok=placed.iv&&placed.dv&&placed.cv.filter(c=>c.role==='cv').length>=needCV;
    const core=U.$('.core',mach);
    if(ok){
      mach.classList.add('live');
      if(core){ core.setAttribute('fill','#12b48c'); core.setAttribute('stroke','#0a6b53'); }
      U.$$('.wire',mach).forEach(p=>p.setAttribute('stroke','#12b48c'));
      say('good','<b>Rig powered on.</b> One factor changed, one outcome measured, everything else identical — that is a controlled experiment.');
      SC.rec('accuracy',true); M.rec(['iv','dv','cv','cx'],true); SC.xp(18,mach); SC.station('wire',18,st.goal);
      if(misfires===0){ WIRE_PERFECT++; if(WIRE_PERFECT>=5) SC.badge('varmaster'); }
      S.seen[w.id]=true; save();
      explain();
    } else if(placed.iv&&placed.dv){
      say('info','Two sockets are live. '+ (needCV-placed.cv.filter(c=>c.role==='cv').length) +' more conditions still need locking down before the comparison is fair.');
    }
  }
  function explain(){
    const cv=w.cvs[0];
    const box=U.el('div',{class:'panel solid',style:{marginTop:'12px'}});
    box.innerHTML='<div class="panel-h"><h3>One more check</h3></div>'
      +'<p class="tiny">In one sentence: why must <b>'+U.esc(cv.l)+'</b> stay the same in every trial of this experiment?</p>';
    const inp=U.el('input',{class:'inp',placeholder:'Because if it changed…'});
    box.appendChild(inp);
    const btn=U.el('button',{class:'btn b sm',style:{marginTop:'8px'},text:'Answer'});
    box.appendChild(btn);
    const f=U.el('div',{style:{marginTop:'8px'}});
    box.appendChild(f);
    body.appendChild(box);
    box.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
    btn.onclick=async()=>{
      const v=inp.value.trim();
      if(v.length<8){ f.insertBefore(UI.feed('warn','Give a full reason.'),f.firstChild); return; }
      const local={pass:/\b(know|tell|sure|which|cause|affect|fair|compar|result|because it would|confus)\b/i.test(v),
        feedback:/\b(know|tell|sure|which|cause|affect|fair|compar|result|confus)\b/i.test(v)
          ? 'Exactly — if two things change at once, you cannot work out which one caused the result.'
          : 'Think about what you could still conclude if that condition changed between trials along with the factor under test.'};
      f.insertBefore(UI.judging(),f.firstChild);
      const res=await grade({concept:'controlled experiment',question:'Why must "'+cv.l+'" stay the same in every trial of: '+w.q,studentAnswer:v,
        rubric:['explains that changing it would make the comparison unfair','explains you could not tell which variable caused the result'],local});
      f.firstChild.remove();
      f.insertBefore(UI.feed(res.pass?'good':'warn','<b>'+(res.pass?'That is the whole logic.':'Close, but not the reason yet.')+'</b> '+U.esc(res.feedback)),f.firstChild);
      if(res.pass){
        SC.rec('design',true); M.rec(['cx','cv'],true); SC.xp(16,box); SC.station('wire',16,st.goal);
        inp.disabled=true; btn.disabled=true;
        const d=U.el('div',{class:'row',style:{marginTop:'12px'}});
        const n=U.el('button',{class:'btn p',text:'Next rig →'}); n.onclick=()=>viewWiring(host);
        const m=U.el('button',{class:'btn q',text:'Lab map'}); m.onclick=()=>go('home');
        const b2=U.el('button',{class:'btn b',text:'Design a full experiment →'}); b2.onclick=()=>go('s/build');
        d.appendChild(n); d.appendChild(b2); d.appendChild(m);
        box.appendChild(d);
      } else { SC.rec('design',false); SC.retry(); }
    };
  }
  DND.bind(body);
}

/* ============================================================
   9 · MODE 9 — CONTROL ROOM
   ============================================================ */
function viewControl(host,params){
  const st=stById('control');
  const pool=U.shuffle(CTRL).filter(c=>!S.seen[c.id]);
  const c=(params&&params.id?CTRL.filter(x=>x.id===params.id)[0]:null)||pool[0]||U.pick(CTRL);
  const assign={}; // dimKey -> {ctrl:i, exp:i}
  let hints=0,checked=0;
  c.dims.forEach(d=>assign[d.k]={ctrl:null,exp:null});
  const {body}=shell(host,st,{title:c.title,sub:c.goal,steps:['Build both groups','Overlay','Compare'],active:0});
  const intro=U.el('div',{class:'panel solid',style:{marginBottom:'12px'}});
  intro.innerHTML='<p class="tiny"><b>The job:</b> build two setups. Every condition must match except <b>one</b>. The <b>control group</b> is the normal / baseline condition you compare against; the <b>experimental group</b> receives the treatment being tested. Drag a setting into each column — the options stay in the tray, because both groups usually need the <i>same</i> one.</p>';
  body.appendChild(intro);

  const grid=U.el('div',{class:'panel solid'});
  const head=U.el('div',{style:{display:'grid',gridTemplateColumns:'minmax(76px,140px) minmax(0,1fr) minmax(0,1fr)',gap:'8px',marginBottom:'8px'}});
  head.innerHTML='<div></div><div class="tag b" style="justify-content:center">CONTROL GROUP<br><span style="font-weight:600;text-transform:none;letter-spacing:0">baseline condition</span></div>'
    +'<div class="tag g" style="justify-content:center">EXPERIMENTAL GROUP<br><span style="font-weight:600;text-transform:none;letter-spacing:0">receives the treatment</span></div>';
  grid.appendChild(head);
  const poolZone=U.el('div',{class:'panel',style:{background:'rgba(18,40,38,.03)',marginBottom:'10px'}});
  poolZone.appendChild(U.el('div',{class:'tiny',style:{marginBottom:'6px'},text:'Available settings — drag each into a column:'}));
  const poolRack=U.el('div',{class:'rack'});
  poolZone.appendChild(poolRack);
  grid.appendChild(poolZone);

  const rows={};
  c.dims.forEach(d=>{
    const rowEl=U.el('div',{style:{display:'grid',gridTemplateColumns:'minmax(76px,140px) minmax(0,1fr) minmax(0,1fr)',gap:'8px',alignItems:'stretch',marginBottom:'8px'}});
    rowEl.appendChild(U.el('div',{class:'tiny',style:{fontWeight:'800',letterSpacing:'.1em',textTransform:'uppercase',alignSelf:'center'},text:d.l}));
    const mkCell=(side)=>{
      const cell=U.el('div',{class:'drop',style:{minHeight:'46px'}});
      cell.innerHTML='<div class="ph">drop here</div>';
      const clear=()=>{
        assign[d.k][side]=null;
        UI.clear(cell); cell.classList.remove('filled');
        cell.innerHTML='<div class="ph">drop here</div>';
      };
      cell.__clear=clear;
      DND.dropNode(cell,(el)=>{
        const data=el.__data;
        if(!data||data.dim!==d.k){ say('warn','That setting belongs to a different row — each row needs its own setting.'); return false; }
        assign[d.k][side]=data.i;
        UI.clear(cell);
        /* the pool keeps its chips: both groups usually need the SAME setting */
        const node=U.el('div',{class:'drag pop'});
        node.innerHTML='<span>'+U.esc(d.opts[data.i])+'</span>';
        const x=U.el('button',{class:'btn q sm',style:{marginLeft:'auto',minHeight:'24px',padding:'0 7px',fontSize:'11px'},text:'×','aria-label':'clear setting'});
        x.onclick=e=>{ e.stopPropagation(); clear(); };
        node.appendChild(x);
        cell.appendChild(node);
        cell.classList.add('filled');
        return true;
      },{hintsel:false});
      rowEl.appendChild(cell);
      rows[d.k+'-'+side]=cell;
    };
    mkCell('ctrl'); mkCell('exp');
    grid.appendChild(rowEl);
    /* one chip per option; dropping it copies it into a column */
    d.opts.forEach((o,i)=>{
      const n=DND.dragNode(U.esc(o),{dim:d.k,i},{group:'ctrl-'+d.k});
      n.__row=d.k;
      poolRack.appendChild(n);
    });
  });
  body.appendChild(grid);
  const fb=U.el('div',{style:{display:'grid',gap:'8px',marginTop:'12px'}});
  body.appendChild(fb);
  function say(t,h){ fb.insertBefore(UI.feed(t,h),fb.firstChild); while(fb.children.length>4) fb.lastChild.remove(); }

  const bar=U.el('div',{class:'row',style:{marginTop:'12px'}});
  const cmp=U.el('button',{class:'btn p',text:'Overlay & compare'});
  const hb=U.el('button',{class:'btn q sm',text:'I’m stuck'});
  bar.appendChild(cmp); bar.appendChild(hb);
  body.appendChild(bar);
  hb.onclick=()=>{
    hints++; SC.hint();
    say('info','<b>Hint:</b> fill every row in both columns, then look at the two columns side by side. Exactly one row is allowed to differ.'
      +(hints>1?'<div class="fx tiny">The row that may differ here is <b>'+U.esc(c.dims.filter(d=>d.iv)[0].l)+'</b>. The control group should be the ordinary, untreated version.</div>':''));
  };

  cmp.onclick=()=>{
    const empty=c.dims.filter(d=>assign[d.k].ctrl===null||assign[d.k].exp===null);
    if(empty.length){ say('warn',empty.length+' row'+(empty.length===1?'':'s')+' still empty in one of the columns. Both groups need a setting for every condition.'); return; }
    checked++;
    const diff=c.dims.filter(d=>assign[d.k].ctrl!==assign[d.k].exp);
    const ivDim=c.dims.filter(d=>d.iv)[0];
    /* overlay */
    const old=U.$('.overlay-panel',body); if(old) old.remove();
    const ov=U.el('div',{class:'panel solid overlay-panel',style:{marginTop:'12px'}});
    ov.innerHTML='<div class="panel-h"><h3>Overlay</h3><span class="sub">what the two setups share</span></div>';
    const list=U.el('div',{style:{display:'grid',gap:'5px'}});
    c.dims.forEach(d=>{
      const same=assign[d.k].ctrl===assign[d.k].exp;
      const r=U.el('div',{class:'attr '+(same?'same':'iv')});
      r.innerHTML='<span class="k">'+U.esc(d.l)+'</span><span class="v">'+U.esc(d.opts[assign[d.k].ctrl])+' &nbsp;vs&nbsp; '+U.esc(d.opts[assign[d.k].exp])+'</span>'
        +'<span class="tag '+(same?'g':'a')+'" style="margin-left:auto">'+(same?'SAME':'DIFFERENT')+'</span>';
      list.appendChild(r);
    });
    ov.appendChild(list);
    body.appendChild(ov);
    ov.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});

    if(diff.length>1){
      say('bad','<b>Too many variables changed.</b> These two setups differ in '+diff.length+' places. Could this experiment tell you whether the treatment caused the result — or would the other differences explain it just as well? Repair the setup so only <b>one</b> row differs.');
      SC.rec('design',false); SC.retry(); M.rec(['cx','cv'],false);
      return;
    }
    if(diff.length===0){
      say('bad','Both columns are identical, so nothing is being tested. The experimental group has to receive the treatment the control group does not.');
      SC.rec('design',false); SC.retry(); M.rec('cx',false);
      return;
    }
    if(diff[0].k!==ivDim.k){
      say('bad','Only one row differs, which is good — but you changed <b>'+U.esc(diff[0].l)+'</b>, and the question asks about <b>'+U.esc(ivDim.l)+'</b>. Change the factor the research question is actually about.');
      SC.rec('design',false); SC.retry(); M.rec(['cx','iv'],false);
      return;
    }
    if(assign[ivDim.k].ctrl!==ivDim.base){
      say('warn','The difference is in the right place, but your columns are swapped. The <b>control group</b> is the normal / baseline condition ('+U.esc(ivDim.opts[ivDim.base])+'); the <b>experimental group</b> receives the treatment.');
      SC.rec('design',false); SC.retry(); M.rec(['cg','eg'],false);
      return;
    }
    say('good','<b>Controlled experiment.</b> Everything matches except <b>'+U.esc(ivDim.l)+'</b>. The control group ('+U.esc(ivDim.opts[ivDim.base])+') is the baseline; the experimental group ('+U.esc(ivDim.opts[1-ivDim.base])+') receives the treatment. Any difference in the result can now be traced to that one change.');
    SC.rec('design',true); M.rec(['cg','eg','cx','cv'],true); SC.xp(26,ov); SC.station('control',26,st.goal);
    S.seen[c.id]=true; save();
    const q=U.el('div',{class:'panel solid',style:{marginTop:'12px'}});
    q.innerHTML='<div class="panel-h"><h3>Name the variables</h3><span class="sub">type them — no options given</span></div>'
      +'<div class="field" style="margin-bottom:8px"><label>Independent variable</label><input class="inp" id="ivA" placeholder="What did the experimenter deliberately change?"></div>'
      +'<div class="field"><label>Dependent variable</label><input class="inp" id="dvA" placeholder="What would you measure in response?"></div>';
    const goBtn=U.el('button',{class:'btn b sm',style:{marginTop:'10px'},text:'Check'});
    q.appendChild(goBtn);
    const qf=U.el('div',{style:{marginTop:'8px'}});
    q.appendChild(qf);
    body.appendChild(q);
    goBtn.onclick=async()=>{
      const iv=U.$('#ivA',q).value.trim(), dv=U.$('#dvA',q).value.trim();
      if(iv.length<3||dv.length<3){ qf.insertBefore(UI.feed('warn','Both need an answer.'),qf.firstChild); return; }
      const ivOk=kwScore(iv,[ivDim.l.toLowerCase().split(' ')[0]]).m>=1||kwHit(iv,[ivDim.l.toLowerCase()])||kwHit(iv,[ivDim.opts[1-ivDim.base].toLowerCase().replace(/[^a-z ]/g,'')]);
      const dvGuess=c.goal.replace(/^(does|do|how)\s+/i,'').replace(/\?/,'');
      const dvOk=kwScore(dv,dvGuess.split(' ').filter(x=>x.length>4).slice(0,3).map(x=>[x])).m>=1;
      const local={pass:ivOk&&dvOk,feedback:ivOk&&dvOk
        ? 'Correct. The independent variable is the factor set on purpose; the dependent variable is the outcome measured in response.'
        : (!ivOk?'The independent variable is the factor the experimenter <b>deliberately changes</b> — look at the one row that differs.':'The dependent variable is the outcome you <b>measure in response</b> to that change — reread the research question.')};
      qf.insertBefore(UI.judging(),qf.firstChild);
      const res=await grade({concept:'variables',question:c.goal+' Control group: '+ivDim.opts[ivDim.base]+'; experimental group: '+ivDim.opts[1-ivDim.base],
        studentAnswer:'Independent: '+iv+' | Dependent: '+dv,
        rubric:['independent variable is the factor deliberately changed','dependent variable is the measured outcome that responds to it'],local});
      qf.firstChild.remove();
      qf.insertBefore(UI.feed(res.pass?'good':'warn','<b>'+(res.pass?'Both correct.':'Check that again.')+'</b> '+res.feedback),qf.firstChild);
      if(res.pass){
        SC.rec('design',true); M.rec(['iv','dv'],true); SC.xp(16,q); SC.station('control',16,st.goal);
        U.$$('#ivA,#dvA',q).forEach(n=>n.disabled=true); goBtn.disabled=true;
        const d=U.el('div',{class:'row',style:{marginTop:'12px'}});
        [['Next setup →','p',()=>viewControl(host)],['Repair Bay →','b',()=>go('s/repair')],['Lab map','q',()=>go('home')]].forEach(b=>{
          const btn=U.el('button',{class:'btn '+b[1],text:b[0]}); btn.onclick=b[2]; d.appendChild(btn);
        });
        q.appendChild(d);
      } else { SC.rec('design',false); SC.retry(); }
    };
  };
  DND.bind(body);
}

function simValue(b,li){
  const base=b.base[li];
  const spread=base>20?3:1;
  let v=base+U.ri(-spread,spread);
  v=U.clamp(v,Math.max(1,base-spread-1),base+spread+1);
  return v;
}
function viewBuild(host,params){
  const st=stById('build');
  const P=S.stations.build||(S.stations.build={stage:0,brief:null,data:{},trials:3,axes:{x:null,y:null},plotted:[]});
  if(params&&params.reset){ P.stage=0; P.brief=null; P.data={}; P.plotted=[]; P.axes={x:null,y:null}; save(); }
  const b=BRIEFS.filter(x=>x.id===P.brief)[0];
  if(!b){ return buildBriefPicker(host,P); }
  if(P.stage===0) return buildDesign(host,b,P);
  if(P.stage===1) return buildRun(host,b,P);

  return buildInterpret(host,b,P);
}

function buildDesign(host,b,P){

  cols.appendChild(left); cols.appendChild(right); body.appendChild(cols);

  const stagePanel=U.el('div',{class:'panel solid'});
  const app=APP.build(stagePanel,b.scene,{readouts:[['DESIGN BAY','assembling'],['TRIALS',String(D.trials)]]});
  left.appendChild(stagePanel);

  const zones=U.el('div',{class:'sockets',style:{marginTop:'12px'}});
  const zCell={};
  const zone=(k,title,sub,multi)=>{
    const s=U.el('div',{class:'sock'}); s.setAttribute('data-k',k);
    s.innerHTML='<div class="sh"><span class="d"></span><b>'+title+'</b></div><div class="tiny">'+sub+'</div>';
    const inn=U.el('div',{class:'in',style:{marginTop:'8px'}});
    s.appendChild(inn);
    zCell[k]={root:s,in:inn,multi};
    DND.dropNode(s,(el)=>place(el,k),{accept:()=>true,hintsel:k!=='lock'});
    zones.appendChild(s);
  };
  zone('change','What I change','one factor, deliberately');
  zone('measure','What I measure','the outcome in response');
  zone('lock','What I lock down','identical in every trial',true);
  body.appendChild(zones);

  /* component rack */
  const rackPanel=U.el('div',{class:'panel solid'});
  rackPanel.appendChild(U.el('div',{class:'panel-h',html:'<h3>Lab bench</h3><span class="sub">drag components into a zone</span>'}));
  const rack=U.el('div',{class:'rack'});
  const comps=[];
  comps.push({id:b.iv.id,label:b.iv.l,role:'iv'});
  comps.push({id:b.dv.id,label:b.dv.l,role:'dv'});
  b.cvs.forEach(c=>comps.push({id:c.id,label:c.l,role:'cv'}));
  b.tools.forEach(t=>comps.push({id:t.id,label:t.l,role:'tool'}));
  b.decoys.forEach(d=>comps.push({id:d.id,label:d.l,role:'decoy'}));
  U.shuffle(comps).forEach(c=>rack.appendChild(DND.dragNode(U.esc(c.label),{id:c.id,role:c.role,label:c.label},{group:'build'})));
  rackPanel.appendChild(rack);
  left.appendChild(rackPanel);

  const fb=U.el('div',{style:{display:'grid',gap:'8px',marginTop:'12px'}});
  body.appendChild(fb);
  function say(t,h){ fb.insertBefore(UI.feed(t,h),fb.firstChild); while(fb.children.length>4) fb.lastChild.remove(); }

  function place(el,k){
    const d=el.__data, comp=comps.filter(c=>c.id===d.id)[0];
    if(!comp) return false;
    if(comp.role==='decoy'){
      say('warn','“'+U.esc(comp.label)+'” would change a second condition. Park it on the bench unless you want to ruin the comparison.');
      SC.rec('design',false); SC.retry(); M.rec('cv',false);
      return false;
    }
    if(k==='change'&&comp.role!=='iv'){
      say('bad',comp.role==='dv'
        ? 'That is the outcome you measure. The thing you <b>change</b> is the factor you set differently on purpose.'
        : (comp.role==='tool'?'An instrument is not a condition. It records the result; it does not vary between trials.'
        : 'That condition has to stay identical in every trial, otherwise you will not know what caused any difference.'));
      SC.rec('design',false); SC.retry(); M.rec(comp.role==='dv'?'iv':'cv',false);
      return false;
    }
    if(k==='measure'&&comp.role!=='dv'){
      say('bad',comp.role==='iv'
        ? 'That is the factor you change. What you <b>measure</b> is the outcome that responds to it.'
        : 'That belongs in the “lock down” zone (or stays on the bench if it is just an instrument).');
      SC.rec('design',false); SC.retry(); M.rec('dv',false);
      return false;
    }
    if(k==='lock'&&(comp.role==='iv'||comp.role==='dv')){
      say('warn','“'+U.esc(comp.label)+'” is one of the two variables this experiment is about — it cannot be locked.');
      SC.rec('design',false); SC.retry();

    if(k!=='lock'||comp.role!=='tool'){ D[k].push(comp.id); }
    el.remove();
    const node=DND.dragNode(U.esc(comp.label),{id:comp.id,role:comp.role,label:comp.label},{group:'build'});
    zCell[k].in.appendChild(node); DND.bind(node);
    zCell[k].root.classList.add('filled');
    node.addEventListener('dblclick',()=>{ D[k]=D[k].filter(x=>x!==comp.id); node.remove(); rack.appendChild(DND.dragNode(U.esc(comp.label),{id:comp.id,role:comp.role,label:comp.label},{group:'build'})); DND.bind(rack.lastChild); syncLocks(); });
    if(k==='change') say('good','<b>Independent variable:</b> '+U.esc(comp.label)+'. Everything else must now stay identical.');
    if(k==='measure') say('good','<b>Dependent variable:</b> '+U.esc(comp.label)+'. This is the number that goes on the graph.');
    if(k==='lock') say(comp.role==='tool'?'info':'good', comp.role==='tool'?'<b>Instrument on the bench.</b> '+U.esc(comp.label)+' is how you measure — not a variable.':'<b>Locked.</b> '+U.esc(comp.label)+' stays identical across trials.');
    SC.rec('design',comp.role!=='tool'); if(comp.role!=='tool') M.rec(k==='change'?'iv':(k==='measure'?'dv':'cv'),true);

  /* trial setup */

    w.appendChild(U.el('span',{class:'tiny',style:{fontWeight:'800',textTransform:'uppercase',letterSpacing:'.1em'},text:label}));
    w.appendChild(dn); w.appendChild(v); w.appendChild(up);
    return w;
  };
  st1.appendChild(stepper('Trials per condition',D.trials,1,5,v=>{D.trials=v;save();}));
  st1.appendChild(stepper('Observation window (s)',D.window,10,120,v=>{D.window=v;save();}));
  setup.appendChild(st1);
  setup.appendChild(U.el('div',{class:'tiny',style:{marginTop:'8px'},html:'More trials smooth out the variation that always shows up in real data. A longer window gives a steadier rate.'}));
  const ctrlZone=U.el('div',{class:'drop',style:{marginTop:'12px',minHeight:'54px'}});
  ctrlZone.innerHTML='<div class="ph">Baseline / control condition — drag one here</div>';
  const lvlRack=U.el('div',{class:'rack',style:{marginTop:'8px'}});

    ctrlZone.appendChild(n); DND.bind(n); ctrlZone.classList.add('filled');

    SC.rec('design',true); M.rec('cg',true); SC.xp(8,ctrlZone); SC.station('build',8,st.goal);

  const hb=U.el('button',{class:'btn q sm',text:'I’m stuck'});
  bar.appendChild(val); bar.appendChild(rst); bar.appendChild(hb);

  hb.onclick=()=>{

      +(D.change.length?'':'<div class="fx tiny">The question is about <b>'+U.esc(b.iv.l)+'</b>, and the outcome is <b>'+U.esc(b.dv.l)+'</b>.</div>'));

  val.onclick=()=>{

          if(res.pass){
            SC.rec('design',true); M.rec(['cx','cv'],true); SC.xp(14,ask); SC.station('build',14,st.goal);
            inp.disabled=true; btn.disabled=true;
            say('warn','Now repair the design: put everything except <b>'+U.esc(b.iv.l)+'</b> back into “lock down”. Double-click a component in a zone to send it back to the bench.');
          } else { SC.rec('design',false); SC.retry(); }
        };
        return;
      }
      say('bad','<b>Not ready to run.</b> '+problems.join(' '));
      SC.rec('design',false); SC.retry();
      return;
    }
    if(D.change[0]!==b.iv.id){ say('bad','The factor you are changing is not the one the research question asks about. Reread: “'+U.esc(b.q)+'”'); SC.rec('design',false); SC.retry(); return; }
    say('good','<b>Design validated.</b> One factor changed, one outcome measured, '+lockedCV+' conditions locked, '+D.trials+' trials per condition, baseline at '+U.esc(b.levels[D.ctrl].l)+'.');
    SC.rec('design',true); M.rec(['cx','iv','dv','cv','cg'],true); SC.xp(26,body); SC.station('build',26,st.goal);
    if(D.warned===0) SC.badge('perfect');
    P.stage=1; P.trials=D.trials; save();
    const go=U.el('button',{class:'btn p',text:'Run the experiment →'});
    go.onclick=()=>viewBuild(host);
    const r=U.el('div',{class:'row',style:{marginTop:'12px'}}); r.appendChild(go); body.appendChild(r);
    go.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
  };

  /* restore existing placements */
  (function restore(){
    ['change','measure','lock'].forEach(k=>{
      (D[k]||[]).slice().forEach(id=>{
        const comp=comps.filter(c=>c.id===id)[0]; if(!comp) return;
        const src=U.$$('.drag',rack).filter(n=>n.__data.id===id)[0];
        if(src) src.remove();
        zCell[k].in.appendChild(DND.dragNode(U.esc(comp.label),{id:comp.id,role:comp.role,label:comp.label},{group:'build'}));
        zCell[k].root.classList.add('filled');
      });
    });
    if(D.ctrl!==null&&D.ctrl!==undefined){
      UI.clear(ctrlZone); ctrlZone.classList.add('filled');
      ctrlZone.appendChild(DND.dragNode(U.esc(b.levels[D.ctrl].l),{lvl:D.ctrl},{group:'lvl'}));
    }
    syncLocks();
  })();
  DND.bind(body);
}
/* ---- stage 1: run trials ---- */
function buildRun(host,b,P){
  const st=stById('build');
  const D=P.design||{};
  const trials=P.trials||3;
  P.data=P.data||{};
  const {body}=shell(host,st,{title:'Run the trials',sub:'Each condition gets '+trials+' trial'+(trials===1?'':'s')+'. Record every number you see — real data wobbles.',steps:['Question','Design','Run','Graph','Interpret'],active:2});
  const cols=U.el('div',{class:'cols narrow'});
  const left=U.el('div'), right=U.el('div',{style:{display:'grid',gap:'12px'}});
  cols.appendChild(left); cols.appendChild(right); body.appendChild(cols);
  const stagePanel=U.el('div',{class:'panel solid'});
  const app=APP.build(stagePanel,b.scene,{readouts:[['CONDITION','—'],['COUNTER','0'],['TIMER','0 s']]});
  left.appendChild(stagePanel);

  const ctrlP=U.el('div',{class:'panel solid'});
  const cnt=U.el('div',{class:'mono',style:{fontSize:'34px',fontWeight:'800',textAlign:'center',padding:'10px 0'},text:'—'});
  ctrlP.innerHTML='<div class="panel-h"><h3>Instrument readout</h3></div>';
  ctrlP.appendChild(cnt);
  const clock=U.el('div',{class:'tiny mono',style:{textAlign:'center'},text:'timer 0 s'});
  ctrlP.appendChild(clock);
  left.appendChild(ctrlP);

  const nb=U.el('div',{class:'panel solid'});
  nb.appendChild(U.el('div',{class:'panel-h',html:'<h3>Lab notebook</h3><span class="sub">record what the instrument shows</span>'}));
  const tbl=U.el('table',{class:'dt'});
  let html='<thead><tr><th>Condition</th>';
  for(let t=1;t<=trials;t++) html+='<th>Trial '+t+'</th>';
  html+='<th>Mean</th></tr></thead><tbody>';
  b.levels.forEach((l,i)=>{
    html+='<tr data-l="'+i+'"><td>'+U.esc(l.l)+'</td>';
    for(let t=0;t<trials;t++) html+='<td data-c="'+i+'-'+t+'"><button class="cellbtn" data-run="'+i+'-'+t+'">▶ run</button></td>';
    html+='<td data-mean="'+i+'" class="num">—</td></tr>';
  });
  tbl.innerHTML=html+'</tbody>';
  nb.appendChild(tbl);
  right.appendChild(nb);

  const fb=U.el('div',{style:{display:'grid',gap:'8px',marginTop:'12px'}});
  right.appendChild(fb);
  function say(t,h){ fb.insertBefore(UI.feed(t,h),fb.firstChild); while(fb.children.length>3) fb.lastChild.remove(); }

  const bar=U.el('div',{class:'row',style:{marginTop:'12px'}});
  const nextBtn=U.el('button',{class:'btn p',text:'Run next trial ▶'});
  const autoBtn=U.el('button',{class:'btn q sm',text:'Auto-run the rest (records for you)'});
  bar.appendChild(nextBtn); bar.appendChild(autoBtn);
  right.appendChild(bar);
  const graphBtn=U.el('button',{class:'btn b',style:{marginTop:'12px',display:'none'},text:'Build the graph →'});
  right.appendChild(graphBtn);

  let running=false;
  function pending(){
    for(let i=0;i<b.levels.length;i++) for(let t=0;t<trials;t++){
      const key=i+'-'+t;
      if(P.data[key]===undefined||P.data[key]===null) return {i,t,key};
    }
    return null;
  }
  function cellOf(i,t){ return U.$('[data-c="'+i+'-'+t+'"]',tbl); }
  function refresh(){
    b.levels.forEach((l,i)=>{
      let s=0,n=0;
      for(let t=0;t<trials;t++){ const v=P.data[i+'-'+t]; if(typeof v==='number'){s+=v;n++;} }
      const m=U.$('[data-mean="'+i+'"]',tbl);
      if(m) m.textContent=n?(Math.round(100*s/n)/100).toFixed(n>1?1:0):'—';
    });
    const p=pending();
    if(!p){
      graphBtn.style.display='';
      say('good','<b>All trials recorded.</b> Look at the means: they do not sit on a perfectly smooth line, because real measurements vary. That variation is normal — the pattern is what matters.');
      SC.rec('data',true); M.rec('data',true); SC.xp(20,tbl); SC.station('build',20,st.goal);
    }
  }
  function armCell(i,t,value){
    const cell=cellOf(i,t);
    UI.clear(cell);
    const inp=U.el('input',{type:'number',inputmode:'numeric','aria-label':'Record trial value',placeholder:'?'});
    const ok=U.el('button',{class:'cellbtn',text:'✓','aria-label':'record'});
    cell.appendChild(inp); cell.appendChild(ok);
    inp.focus();
    const commit=()=>{
      const v=parseFloat(inp.value);
      if(isNaN(v)){ inp.classList.add('err'); setTimeout(()=>inp.classList.remove('err'),500); return; }
      if(v!==value){
        say('warn','The counter read <b>'+value+' '+U.esc(b.unit)+'</b>. Record what the instrument actually showed, not what you expected.');
        inp.value=''; inp.focus(); SC.rec('data',false); SC.retry();
        return;
      }
      P.data[i+'-'+t]=value; save();
      UI.clear(cell); cell.appendChild(U.el('span',{class:'num pop',text:String(value)}));
      SC.rec('data',true); M.rec('data',true); SC.xp(5,cell); SC.station('build',5,st.goal);
      refresh();
    };
    ok.onclick=commit;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();commit();} });
  }
  function runOne(i,t,auto){
    if(running) return;
    running=true; nextBtn.disabled=true; autoBtn.disabled=true;
    const lvl=b.levels[i];
    const value=simValue(b,i);
    const screens=b.id==='d1'?i:(b.id==='d2'?0:0);
    app.light(lvl.v); app.screens(screens);
    app.readouts([['CONDITION',lvl.l],['COUNTER','counting…'],['WINDOW',(P.design&&P.design.window||30)+' s']]);
    const total=P.design&&P.design.window||30;
    const dur=U.reduced()?300:1600;
    let t0=Date.now();
    const iv=setInterval(()=>{
      const el=Math.min(total,Math.round((Date.now()-t0)/dur*total));
      clock.textContent='timer '+el+' s';
    },80);
    cnt.textContent='…';
    app.stream(b.id==='d1'?value:2,total);
    setTimeout(()=>{
      clearInterval(iv); running=false; nextBtn.disabled=false; autoBtn.disabled=false;
      app.stop();
      clock.textContent='timer '+total+' s';
      cnt.textContent=value+' '+b.unit;
      app.readouts([['CONDITION',lvl.l],['COUNTER',value+' '+b.unit],['WINDOW',total+' s']]);
      if(b.id==='d1') app.bubble(value,900);
      if(auto){
        P.data[i+'-'+t]=value; save();
        const cell=cellOf(i,t); UI.clear(cell); cell.appendChild(U.el('span',{class:'num',text:String(value)}));
        refresh();
      } else armCell(i,t,value);
    },dur+250);
  }
  nextBtn.onclick=()=>{ const p=pending(); if(!p){ UI.toast('Every trial is already recorded.'); return; } runOne(p.i,p.t,false); };
  autoBtn.onclick=()=>{
    let p=pending(); if(!p) return;
    UI.toast('Auto-running the remaining trials…');
    const step=()=>{
      p=pending(); if(!p){ refresh(); return; }
      runOne(p.i,p.t,true);
      setTimeout(step,300);
    };
    step();
  };
  graphBtn.onclick=()=>{ P.stage=2; save(); viewBuild(host); };
  U.$$('[data-run]',tbl).forEach(btn=>{
    btn.onclick=()=>{
      const parts=btn.getAttribute('data-run').split('-');
      const i=+parts[0],t=+parts[1];
      if(P.data[i+'-'+t]!==undefined&&P.data[i+'-'+t]!==null){ UI.toast('That trial is already recorded.'); return; }
      runOne(i,t,false);
    };
  });
  /* restore recorded cells */
  b.levels.forEach((l,i)=>{ for(let t=0;t<trials;t++){
    const v=P.data[i+'-'+t];
    if(typeof v==='number'){ const c=cellOf(i,t); if(c){ UI.clear(c); c.appendChild(U.el('span',{class:'num',text:String(v)})); } }
  }});
  refresh();
  DND.bind(body);
}
/* ---- stage 2: graph ---- */
function buildGraph(host,b,P){
  const st=stById('build');
  const trials=P.trials||3;
  const {body}=shell(host,st,{title:'Build the graph',sub:'You choose the axes. Independent variable on X, dependent variable on Y — but you have to place them yourself.',steps:['Question','Design','Run','Graph','Interpret'],active:3});
  const cols=U.el('div',{class:'cols'});
  const left=U.el('div'), right=U.el('div',{style:{display:'grid',gap:'12px'}});
  cols.appendChild(left); cols.appendChild(right); body.appendChild(cols);

  const axPanel=U.el('div',{class:'panel solid'});
  axPanel.appendChild(U.el('div',{class:'panel-h',html:'<h3>Axis plates</h3><span class="sub">drag a variable onto a plate, then type its units</span>'}));
  const tokens=U.el('div',{class:'rack',style:{marginBottom:'10px'}});
  const toks=[{id:'iv',l:b.iv.l},{id:'dv',l:b.dv.l},{id:'trial',l:'Trial number'},{id:'clock',l:'Time of day'}];
  toks.forEach(t=>tokens.appendChild(DND.dragNode(U.esc(t.l),{id:t.id,label:t.l},{group:'ax'})));
  axPanel.appendChild(tokens);
  const plates={};
  ['x','y'].forEach(k=>{
    const p=U.el('div',{class:'axis-plate'});
    p.innerHTML='<span class="lab">'+(k==='x'?'X axis':'Y axis')+'</span><span class="v" style="font-weight:800"></span>';
    const unit=U.el('input',{class:'inp',style:{minHeight:'36px',maxWidth:'150px',marginLeft:'auto'},placeholder:'units, e.g. %, cm, s'});
    p.appendChild(unit);
    plates[k]={el:p,unit};
    DND.dropNode(p,(el)=>{
      const id=el.__data.id;
      if(id==='trial'||id==='clock'){
        say('warn','“'+U.esc(el.__data.label)+'” is not one of the two variables in this experiment — it was never deliberately changed and never measured as an outcome.');
        SC.rec('data',false); SC.retry();
        return false;
      }
      P.axes[k]=id; save();
      el.remove();
      U.$('.v',p).textContent=el.__data.label;
      p.classList.add('filled');
      say('good','<b>'+(k==='x'?'X':'Y')+' axis:</b> '+U.esc(el.__data.label)+'. Now give it units.');
      SC.rec('data',true); M.rec('data',true); SC.xp(6,p); SC.station('build',6,st.goal);
      draw();
      return true;
    },{hintsel:true});
    axPanel.appendChild(p);
  });
  axPanel.appendChild(U.el('div',{class:'tiny',style:{marginTop:'8px'},html:'Independent variable → X axis. Dependent variable → Y axis. Units turn a number into a measurement.'}));
  left.appendChild(axPanel);

  const dataPanel=U.el('div',{class:'panel solid'});
  dataPanel.appendChild(U.el('div',{class:'panel-h',html:'<h3>Plot the means</h3><span class="sub">drag each condition onto the grid</span>'}));
  const chips=U.el('div',{class:'rack'});
  b.levels.forEach((l,i)=>{
    let s=0,n=0;
    for(let t=0;t<trials;t++){ const v=P.data[i+'-'+t]; if(typeof v==='number'){s+=v;n++;} }
    const mean=n?Math.round(100*s/n)/100:null;
    const c=DND.dragNode(U.esc(l.l)+' → '+(mean===null?'—':mean+' '+b.unit),{lvl:i,mean},{group:'pt'});
    chips.appendChild(c);
  });
  dataPanel.appendChild(chips);
  left.appendChild(dataPanel);

  const gPanel=U.el('div',{class:'panel solid'});
  gPanel.appendChild(U.el('div',{class:'panel-h',html:'<h3>Graph</h3><span class="sub" id="gstat">waiting for axes</span>'}));
  const gw=U.el('div',{class:'graphwrap',style:{height:'300px',position:'relative'}});
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 400 300');
  svg.setAttribute('preserveAspectRatio','none');
  svg.style.width='100%'; svg.style.height='300px'; svg.style.display='block';
  gw.appendChild(svg);
  gPanel.appendChild(gw);
  DND.dropNode(gw,(el)=>{
    if(!P.axes.x||!P.axes.y){ say('warn','Set both axis plates before plotting.'); return false; }
    const d=el.__data;
    if(d.mean===null||d.mean===undefined){ say('warn','That condition has no recorded data yet.'); return false; }
    if(P.plotted.indexOf(d.lvl)>=0) return false;
    P.plotted.push(d.lvl); save();
    el.remove();
    say('good','Point plotted for '+U.esc(b.levels[d.lvl].l)+'.');
    SC.rec('data',true); SC.xp(6,gw); SC.station('build',6,st.goal);
    draw();
    return true;
  },{hintsel:true});
  right.appendChild(gPanel);

  const fb=U.el('div',{style:{display:'grid',gap:'8px',marginTop:'12px'}});
  right.appendChild(fb);
  function say(t,h){ fb.insertBefore(UI.feed(t,h),fb.firstChild); while(fb.children.length>3) fb.lastChild.remove(); }

  const trendBox=U.el('div',{class:'panel solid',style:{marginTop:'12px',display:'none'}});
  trendBox.innerHTML='<div class="panel-h"><h3>What is the trend?</h3><span class="sub">describe it in words</span></div>';
  const ti=U.el('textarea',{class:'inp',placeholder:'As … increases, …'});
  trendBox.appendChild(ti);
  const tb=U.el('button',{class:'btn p sm',style:{marginTop:'8px'},text:'Describe the trend'});
  trendBox.appendChild(tb);
  const tf=U.el('div',{style:{marginTop:'8px'}});
  trendBox.appendChild(tf);
  right.appendChild(trendBox);

  function draw(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const st=U.$('#gstat',gPanel);
    const hasX=!!P.axes.x, hasY=!!P.axes.y;
    const mk=(t,a)=>{const n=document.createElementNS(svgNS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
    svg.appendChild(mk('rect',{x:0,y:0,width:400,height:300,fill:'#fff'}));
    svg.appendChild(mk('path',{d:'M46 12V268H386',stroke:'#c2d0cc','stroke-width':'2',fill:'none'}));
    if(!hasX||!hasY){ if(st) st.textContent='waiting for axes'; return; }
    const xTok=toks.filter(t=>t.id===P.axes.x)[0], yTok=toks.filter(t=>t.id===P.axes.y)[0];
    const swapped=(P.axes.x==='dv'&&P.axes.y==='iv');
    const xs=b.levels.map((l,i)=>l.v);
    const xMin=Math.min.apply(null,xs), xMax=Math.max.apply(null,xs);
    const pts=P.plotted.slice().sort((a,b)=>a-b).map(i=>{
      let s=0,n=0; for(let t=0;t<trials;t++){ const v=P.data[i+'-'+t]; if(typeof v==='number'){s+=v;n++;} }
      return {i,x:xs[i],y:n?s/n:null};
    }).filter(p=>p.y!==null);
    const ys=pts.map(p=>p.y); const yMin=0, yMax=Math.max.apply(null,ys.concat([1]))*1.15;
    const px=x=>46+((x-xMin)/((xMax-xMin)||1))*330;
    const py=y=>268-((y-yMin)/((yMax-yMin)||1))*244;
    /* gridlines + ticks */
    for(let g=0;g<=4;g++){
      const yv=yMin+(yMax-yMin)*g/4, yy=py(yv);
      svg.appendChild(mk('path',{d:'M46 '+yy+'H386',stroke:'#eef2f1','stroke-width':'1'}));
      const tx=mk('text',{x:40,y:yy+4,'text-anchor':'end','font-size':'9',fill:'#8b9c98','font-family':'ui-monospace,monospace'});
      tx.textContent=Math.round(yv*10)/10; svg.appendChild(tx);
    }
    xs.forEach(x=>{
      const tx=mk('text',{x:px(x),y:282,'text-anchor':'middle','font-size':'9',fill:'#8b9c98','font-family':'ui-monospace,monospace'});
      tx.textContent=x; svg.appendChild(tx);
    });
    const xl=mk('text',{x:216,y:298,'text-anchor':'middle','font-size':'11',fill:'#31423f','font-weight':'700'});
    xl.textContent=xTok.l+(plates.x.unit.value?' ('+plates.x.unit.value+')':''); svg.appendChild(xl);
    const yl=mk('text',{x:14,y:150,'text-anchor':'middle','font-size':'11',fill:'#31423f','font-weight':'700',transform:'rotate(-90 14 150)'});
    yl.textContent=yTok.l+(plates.y.unit.value?' ('+plates.y.unit.value+')':''); svg.appendChild(yl);
    if(pts.length>=2){
      const d=pts.map((p,k)=>(k?'L':'M')+px(p.x)+' '+py(p.y)).join(' ');
      const line=mk('path',{d,stroke:'#0f9d7a','stroke-width':'3',fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});
      svg.appendChild(line);
      try{ const L=line.getTotalLength(); line.style.setProperty('--len',L); line.classList.add('gline'); }catch(e){}
    }
    pts.forEach((p,k)=>{
      const c=mk('circle',{cx:px(p.x),cy:py(p.y),r:6,fill:'#2f6fed',stroke:'#fff','stroke-width':'2',class:'gpt'});
      c.style.animationDelay=(k*120)+'ms';
      svg.appendChild(c);
      const t=mk('text',{x:px(p.x),y:py(p.y)-12,'text-anchor':'middle','font-size':'10',fill:'#31423f','font-weight':'700'});
      t.textContent=Math.round(p.y*10)/10; svg.appendChild(t);
    });
    if(st) st.textContent=pts.length+' of '+b.levels.length+' conditions plotted'+(swapped?' · axes look swapped':'');
    if(swapped&&!P._swapWarned){
      P._swapWarned=1;
      say('warn','Check your axes. The factor you <b>deliberately changed</b> belongs on X; the outcome you <b>measured</b> belongs on Y. Right now they are the other way round, so the line is describing the relationship backwards.');
      SC.rec('data',false); SC.retry(); M.rec('data',false);
    }
    if(pts.length>=b.levels.length&&!swapped){
      trendBox.style.display='';
      trendBox.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
      if(!P._trendDone) say('good','<b>Graph complete.</b> Every condition is plotted and the axes are the right way round.');
    }
  }
  tb.onclick=async()=>{
    const v=ti.value.trim();
    if(v.length<10){ tf.insertBefore(UI.feed('warn','Describe the pattern in a full sentence.'),tf.firstChild); return; }
    const s=kwScore(v,b.trendKw);
    const local={pass:s.m>=2,score:s.n?s.m/s.n:0,
      feedback:s.m>=2?'That states the relationship correctly — one variable moves, the other follows.'
        :(s.m===1?'Half of it. A trend names <b>both</b> variables and the direction each one moves.':'I cannot find the relationship in that sentence. Say what happens to '+b.dv.l.toLowerCase()+' as '+b.iv.l.toLowerCase()+' changes.')};
    tf.insertBefore(UI.judging(),tf.firstChild);
    const res=await grade({concept:'interpreting data',question:'Experiment: '+b.q+' Data: '+b.levels.map((l,i)=>l.l+' = '+P.plotted.indexOf(i)>=0?'plotted':'').join('; ')+' with means from the notebook.',
      studentAnswer:v,rubric:['names both variables','states the direction of change correctly','describes a relationship rather than a single value'],local});
    tf.firstChild.remove();
    tf.insertBefore(UI.feed(res.pass?'good':'warn','<b>'+(res.pass?'That is the trend.':'Not quite.')+'</b> '+U.esc(res.feedback)),tf.firstChild);
    if(res.pass){
      P._trendDone=1; save();
      SC.rec('data',true); M.rec('data',true); SC.xp(24,trendBox); SC.station('build',24,st.goal);
      SC.badge('analyst');
      ti.disabled=true; tb.disabled=true;
      const r=U.el('div',{class:'row',style:{marginTop:'12px'}});
      const nb=U.el('button',{class:'btn p',text:'Interpret the results →'});
      nb.onclick=()=>{ P.stage=3; save(); viewBuild(host); };
      r.appendChild(nb); trendBox.appendChild(r);
    } else { SC.rec('data',false); SC.retry(); M.rec('data',false); }
  };
  ['x','y'].forEach(k=>plates[k].unit.addEventListener('input',()=>{ draw(); }));
  DND.bind(body);
  draw();
}
/* ---- stage 3: interpret ---- */
function buildInterpret(host,b,P){
  const st=stById('build');
  const {body}=shell(host,st,{title:'What did the evidence say?',sub:'Read your own data and decide what it supports.',steps:['Question','Design','Run','Graph','Interpret'],active:4});
  const panel=U.el('div',{class:'panel solid'});
  const trials=P.trials||3;
  let rows='';
  b.levels.forEach((l,i)=>{
    const vals=[]; for(let t=0;t<trials;t++){ const v=P.data[i+'-'+t]; if(typeof v==='number') vals.push(v); }
    const mean=vals.length?Math.round(100*vals.reduce((a,c)=>a+c,0)/vals.length)/100:null;
    rows+='<tr><td>'+U.esc(l.l)+'</td><td class="num">'+vals.join(', ')+'</td><td class="num"><b>'+(mean===null?'—':mean)+'</b></td></tr>';
  });

   +'<table class="dt"><thead><tr><th>Condition</th><th>Trials ('+U.esc(b.unit)+')</th><th>Mean</th></tr></thead><tbody>'+rows+'</tbody></table>'

    +'<textarea class="inp" id="concl" placeholder="The evidence supports / does not support … because …"></textarea></div>';

    const proven=/\b(prove|proven|proves|proof|100%|certain)\b/i.test(v);

        :(!supports?'Say plainly whether the evidence supports the hypothesis or not.'
        :(dir.m<2?'You named the verdict but not the relationship. State what happens to '+b.dv.l.toLowerCase()+' as '+b.iv.l.toLowerCase()+' changes.'

       +'<div class="row" style="margin-top:12px"><button class="btn p" data-n>Another investigation →</button><button class="btn b" data-c>Start a campaign case →</button><button class="btn q" data-m>Lab map</button></div>';

function viewRepair(host,params){
  const st=stById('repair');
  const pool=U.shuffle(BROKEN).filter(x=>!S.seen[x.id]);
  const x=(params&&params.id?BROKEN.filter(v=>v.id===params.id)[0]:null)||pool[0]||U.pick(BROKEN);
  const state={}; x.dims.forEach(d=>state[d.k]=null);
  const flags={},fixed={},notesFlag={};
  let hints=0;
  const {body}=shell(host,st,{title:x.title,sub:x.goal,steps:['Inspect','Flag','Repair','Explain'],active:1});
  body.appendChild(U.el('div',{class:'tag a',style:{marginBottom:'10px'},text:'Difficulty '+x.lvl+' of 4'}));
  const intro=U.el('div',{class:'panel solid',style:{marginBottom:'12px'}});
  intro.innerHTML='<p class="tiny"><b>The job:</b> something about this setup makes the comparison useless. Tap the settings that <b>should not be different</b> between the setups. Leave the one difference that is the actual point of the experiment. Then repair it.</p>';
  body.appendChild(intro);

  const cards=U.el('div',{style:{display:'grid',gap:'12px',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}});
  const cells={};
  x.cards.forEach(card=>{
    const c=U.el('div',{class:'card2'});
    c.innerHTML='<div class="ch">'+U.esc(card.l)+'</div>';
    x.dims.forEach(d=>{
      const row=U.el('div',{class:'attr',tabindex:'0'});
      row.innerHTML='<span class="k">'+U.esc(d.l)+'</span><span class="v">'+U.esc(card.a[d.k])+'</span>';
      row.onclick=()=>toggle(d,card,row);
      row.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();toggle(d,card,row);} });
      c.appendChild(row);
      cells[card.id+'-'+d.k]=row;
    });
    cards.appendChild(c);
  });
  body.appendChild(cards);
  if(x.notes&&x.notes.length){
    const np=U.el('div',{class:'panel solid',style:{marginTop:'12px'}});
    np.appendChild(U.el('div',{class:'panel-h',html:'<h3>Lab notes</h3><span class="sub">tap anything that will not stand up</span>'}));
    x.notes.forEach(n=>{
      const row=U.el('div',{class:'attr',tabindex:'0'});
      row.innerHTML='<span class="v">'+U.esc(n.t)+'</span>';
      row.onclick=()=>{
        if((x.noteFlaws||[]).indexOf(n.id)>=0){
          if(notesFlag[n.id]) return;
          notesFlag[n.id]=1; row.classList.add('flag');
          say('good','<b>Found it.</b> That line is the problem.');
          SC.rec('evidence',true); SC.xp(8,row); SC.station('repair',8,st.goal);
        } else {
          say('info','That line is fine — it is just a record of what was measured.');
          SC.rec('evidence',false); SC.retry();
        }
      };
      np.appendChild(row);
    });
    body.appendChild(np);
  }
  const fb=U.el('div',{style:{display:'grid',gap:'8px',marginTop:'12px'}});
  body.appendChild(fb);
  function say(t,h){ fb.insertBefore(UI.feed(t,h),fb.firstChild); while(fb.children.length>4) fb.lastChild.remove(); }

  function toggle(d,card,row){
    const key=card.id+'-'+d.k;
    if(fixed[key]) { UI.toast('That one is already repaired.'); return; }
    if(card.a[d.k]==='—'){
      say('warn','There is no second setup here at all — that <b>is</b> the flaw. With nothing to compare against, no measurement means anything. Flag the lab note that describes the missing comparison.');
      SC.rec('design',false); SC.retry(); M.rec(['cg','cx'],false);
      return;
    }
    const other=x.cards.filter(cd=>cd!==card)[0];
    const differs=!!other&&other.a[d.k]!==card.a[d.k];
    const isFlaw=(x.flaws||[]).indexOf(d.k)>=0;
    if(x.iv===d.k&&differs){
      /* the variable under test is allowed to differ — never leave a flag on it */
      row.classList.remove('flag');
      if(flags[d.k]) flags[d.k][card.id]=false;
      say('warn','That difference is the <b>point</b> of the experiment — it is the factor being tested. The independent variable is the one condition the experimenter deliberately changes; everything else has to match.');
      SC.rec('design',false); SC.retry(); M.rec('cx',false);
      return;
    }
    if(!isFlaw&&!differs){
      row.classList.remove('flag');
      say('info','Both setups already read “'+U.esc(card.a[d.k])+'” for '+U.esc(d.l).toLowerCase()+'. A matching condition is exactly what you want — nothing to flag there.');
      return;
    }
    const on=!row.classList.contains('flag');
    row.classList.toggle('flag',on);
    flags[d.k]=flags[d.k]||{}; flags[d.k][card.id]=on;
    if(!on) return;
    if(isFlaw){
      say('good','<b>Unfair difference.</b> '+U.esc(d.l)+' should be identical in every setup, or the comparison stops meaning anything.');
      SC.rec('design',true); M.rec('cv',true); SC.xp(8,row); SC.station('repair',8,st.goal);
    } else if(d.k==='B'){
      say('good','<b>That is the real flaw.</b> There is no second setup at all, so there is nothing to compare against.');
      SC.rec('design',true); M.rec(['cg','cx'],true); SC.xp(8,row); SC.station('repair',8,st.goal);
    } else {
      say('info','That difference is not one of the problems here. Unflag it and keep looking.');
      SC.rec('design',false); SC.retry();
    }
  }
  const bar=U.el('div',{class:'row',style:{marginTop:'12px'}});
  const chk=U.el('button',{class:'btn p',text:'Check the flags'});
  const hb=U.el('button',{class:'btn q sm',text:'I’m stuck'});
  bar.appendChild(chk); bar.appendChild(hb); body.appendChild(bar);
  hb.onclick=()=>{
    hints++; SC.hint();
    const unfound=(x.flaws||[]).filter(k=>!(flags[k]&&(flags[k][x.cards[0].id]||flags[k][(x.cards[1]||{}).id])));
    say('info','<b>Hint:</b> read down each row. Any row where the two setups disagree is either the variable under test or an unfair difference.'
      +(hints>1&&unfound.length?'<div class="fx tiny">Look hard at the <b>'+U.esc((x.dims.filter(d=>d.k===unfound[0])[0]||{}).l||'lab notes')+'</b> row.</div>':''));
  };
  chk.onclick=()=>{
    const need=(x.flaws||[]).filter(k=>x.dims.some(d=>d.k===k)).concat(x.noteFlaws||[]);
    const got=Object.keys(flags).filter(k=>flags[k][x.cards[0].id]||flags[k][(x.cards[1]||{}).id]).concat(Object.keys(notesFlag).filter(k=>notesFlag[k]));
    const miss=need.filter(k=>got.indexOf(k)<0);
    const extra=got.filter(k=>need.indexOf(k)<0);
    if(!miss.length&&!extra.length){
      say('good','<b>Every flaw found</b> ('+need.length+' of them). Now repair the setup.');
      SC.rec('design',true); M.rec(['cx','cv'],true); SC.xp(14,body); SC.station('repair',14,st.goal);
      repair();
    } else if(miss.length){
      say('warn','You flagged '+got.length+' problem'+(got.length===1?'':'s')+', but '+miss.length+' more remain. Keep reading the rows — and the lab notes.');
      SC.rec('design',false); SC.retry();
    } else {
      say('warn','You flagged '+extra.length+' thing'+(extra.length===1?'':'s')+' that is not actually unfair. One difference is allowed — the one being tested.');
      SC.rec('design',false); SC.retry();
    }
  };
  function repair(){
    const fixKeys=Object.keys(x.fix||{});
    if(!fixKeys.length){ askQuestion(); return; }
    const rp=U.el('div',{class:'panel solid',style:{marginTop:'12px'}});
    rp.innerHTML='<div class="panel-h"><h3>Repair</h3><span class="sub">drag a value across so both setups share it</span></div>'
      +'<p class="tiny">Drag the value you want <b>both</b> setups to use onto the matching row of the other card. Which value you keep matters less than the fact that they match.</p>';
    body.appendChild(rp);
    rp.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
    fixKeys.forEach(k=>{
      const d=x.dims.filter(v=>v.k===k)[0];
      x.cards.forEach((card,ci)=>{
        const other=x.cards[1-ci];
        const cell=cells[card.id+'-'+k];
        const chip=DND.dragNode(U.esc(card.a[k]),{dim:k,from:card.id},{group:'fix'});
        cell.appendChild(chip);
        const target=cells[other.id+'-'+k];
        DND.dropNode(target,(el)=>{
          if(el.__data.dim!==k) return false;
          const val=el.__data.from===card.id?card.a[k]:other.a[k];
          other.a[k]=val; card.a[k]=val;
          U.$('.v',target).textContent=val; U.$('.v',cell).textContent=val;
          target.classList.remove('flag'); cell.classList.remove('flag');
          target.classList.add('same'); cell.classList.add('same');
          fixed[card.id+'-'+k]=1; fixed[other.id+'-'+k]=1;
          el.remove();
          say('good','<b>'+U.esc(d.l)+' matched</b> — both setups now read “'+U.esc(val)+'”.');
          SC.rec('design',true); M.rec('cv',true); SC.xp(8,target); SC.station('repair',8,st.goal);
          if(Object.keys(fixed).length>=fixKeys.length*2){
            say('good','<b>Setup repaired.</b> The only difference left is the one being tested.');
            SC.xp(16,rp); SC.station('repair',16,st.goal);
            askQuestion();
          }
          return true;
        });
      });
    });
    DND.bind(body);
  }
  function askQuestion(){
    const aq=U.el('div',{class:'panel solid',style:{marginTop:'12px'}});
    aq.innerHTML='<div class="panel-h"><h3>Now explain</h3><span class="sub">in your own words</span></div>'
      +'<p class="tiny" style="font-weight:700">'+U.esc(x.ask)+'</p>';
    const inp=U.el('textarea',{class:'inp',placeholder:'Your answer…'});
    aq.appendChild(inp);
    const btn=U.el('button',{class:'btn p sm',style:{marginTop:'8px'},text:'Submit'});
    aq.appendChild(btn);
    const f=U.el('div',{style:{marginTop:'8px'}});
    aq.appendChild(f);
    body.appendChild(aq);
    aq.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
    btn.onclick=async()=>{
      const v=inp.value.trim();
      if(v.length<12){ f.insertBefore(UI.feed('warn','Write a full answer.'),f.firstChild); return; }
      const s=kwScore(v,x.askKw);
      const local={pass:s.ok,score:s.n?s.m/s.n:0,
        feedback:s.ok?'That is the reasoning a reviewer would accept.'
          :'Your answer is missing the key idea. Try to mention: '+(s.missing||[]).join(', ')+'.'};
      f.insertBefore(UI.judging(),f.firstChild);
      const res=await grade({concept:'controlled experiment',question:x.goal+' '+x.ask,studentAnswer:v,
        rubric:['addresses the specific flaw in this experiment','uses correct variable terminology','is scientifically accurate'],local});
      f.firstChild.remove();
      f.insertBefore(UI.feed(res.pass?'good':'warn','<b>'+(res.pass?'Correct.':'Not yet.')+'</b> '+U.esc(res.feedback)),f.firstChild);
      if(res.pass){
        SC.rec('evidence',true); M.rec(['cx','cv','data'],true); SC.xp(22,aq); SC.station('repair',22,st.goal);
        S.seen[x.id]=true; save();
        inp.disabled=true; btn.disabled=true;
        const d=U.el('div',{class:'row',style:{marginTop:'12px'}});
        [['Next broken setup →','p',()=>viewRepair(host)],['Design Bay →','b',()=>go('s/build')],['Lab map','q',()=>go('home')]].forEach(bb=>{
          const n=U.el('button',{class:'btn '+bb[1],text:bb[0]}); n.onclick=bb[2]; d.appendChild(n);
        });
        aq.appendChild(d);
      } else { SC.rec('evidence',false); SC.retry(); }
    };
  }
  DND.bind(body);
}

const CAMP_STAGES=[
 {id:'observe',n:'Inspect the scene',act:'Observe the scene and record what you see'},
 {id:'split',n:'Evidence or inference',act:'Separate the observations from the inferences'},
 {id:'question',n:'Research question',act:'Write the research question'},
 {id:'hypo',n:'Hypothesis',act:'Form a testable hypothesis'},
 {id:'vars',n:'Variables',act:'Identify the independent and dependent variables'},
 {id:'const',n:'Constants',act:'Choose the conditions to hold constant'},
 {id:'run',n:'Run the trials',act:'Run repeated trials and collect data'},

];
function viewCampaign(host){
  const st=stById('campaign');
  const C=S.campaign;
  if(C.idx<0){ C.idx=0; C.stage=0; save(); }
  const idx=U.clamp(C.idx,0,CASES.length-1);
  const c=CASES[idx];
  const CD=S.campaign.d||(S.campaign.d={});
  const D=CD[c.id]||(CD[c.id]={stage:0,data:{},plotted:[],axes:{},obs:[],hints:0});
  const g=c.guidance;
  const {body,wrap}=shell(host,st,{title:'Case '+(idx+1)+' · '+c.title,sub:c.brief,
    steps:g===3?CAMP_STAGES.map(s=>s.n):(g===2?CAMP_STAGES.map(s=>s.n):CAMP_STAGES.map((s,i)=>'Step '+(i+1))),
    active:D.stage});
  if(g===1){
    body.insertBefore(U.el('p',{class:'tiny',style:{marginBottom:'10px'},html:'This case runs with almost no scaffolding. You decide what to do next.'}),body.firstChild);
  }
  const stageHost=U.el('div');
  body.appendChild(stageHost);
  const api={host:stageHost,case:c,D,g,idx,advance,shellBody:body};
  function advance(){
    D.stage++; save();
    if(D.stage>=CAMP_STAGES.length){
      C.idx=Math.min(CASES.length-1,idx+1); C.stage=0; save();
      SC.station('campaign',40,st.goal);
      const d=U.el('div',{class:'panel solid'});
      d.innerHTML='<div class="panel-h"><h3>Case closed · '+U.esc(c.title)+'</h3></div>'
       +'<p class="tiny">You inspected the scene, separated evidence from inference, wrote the question and hypothesis, named the variables, locked the constants, ran repeated trials, graphed the result and decided what the evidence supports.</p>'
       +(D.hints===0?'<p class="tiny" style="margin-top:8px"><b>No hints used.</b> That is scientific independence.</p>':'')
       +'<div class="row" style="margin-top:12px"><button class="btn p" data-n>'+(idx+1<CASES.length?'Next case →':'Back to the lab map')+'</button></div>';
      UI.clear(stageHost); stageHost.appendChild(d);

      d.querySelector('[data-n]').onclick=()=>{ if(idx+1<CASES.length) viewCampaign(host); else go('home'); };

  }
  function render(){
    UI.clear(stageHost);
    const stage=CAMP_STAGES[D.stage];
    if(g===1&&D.stage>0&&!D._unlocked){ return actionPicker(stage); }
    D._unlocked=false;
    RENDERERS[stage.id](api);
  }
  function actionPicker(stage){
    const pool=U.shuffle(CAMP_STAGES.filter((s,i)=>i!==D.stage)).slice(0,3).map(s=>s.act);
    const opts=U.shuffle([stage.act].concat(pool));

    box.innerHTML='<div class="panel-h"><h3>What is the next move?</h3><span class="sub">drag it onto the pipeline</span></div>';
    const rack=U.el('div',{class:'rack'});
    opts.forEach(o=>rack.appendChild(DND.dragNode(U.esc(o),{o},{group:'act'})));
    box.appendChild(rack);
    const slot=U.el('div',{class:'drop',style:{marginTop:'12px',minHeight:'56px'}});
    slot.innerHTML='<div class="ph">Next step in the investigation</div>';
    const fb=U.el('div',{style:{marginTop:'10px'}});
    box.appendChild(slot); box.appendChild(fb);
    DND.dropNode(slot,(el)=>{
      if(el.__data.o===stage.act){
        el.remove();
        D._unlocked=true; save();
        UI.clear(fb); fb.appendChild(UI.feed('good','<b>Correct sequence.</b> '+U.esc(stage.act)+'.'));
        SC.rec('accuracy',true); SC.xp(10,slot);
        setTimeout(render,450);
      } else {
        UI.clear(fb); fb.appendChild(UI.feed('warn','Not yet. Look at what you already have: what is missing before you could do that?'));
        SC.rec('accuracy',false); SC.retry();
      }
      return true;
    },{hintsel:true});
    stageHost.appendChild(box);
    DND.bind(box);
  }
  function hint(text){
    D.hints++; SC.hint(); save();
    const f=U.$('.camp-fb',stageHost)||stageHost;
    f.insertBefore(UI.feed('info','<b>Hint:</b> '+text),f.firstChild);
  }
  api.hint=hint;
  api.fb=function(t,h){
    let f=U.$('.camp-fb',stageHost);
    if(!f){ f=U.el('div',{class:'camp-fb',style:{display:'grid',gap:'8px',marginTop:'12px'}}); stageHost.appendChild(f); }
    f.insertBefore(UI.feed(t,h),f.firstChild);
    while(f.children.length>4) f.lastChild.remove();
  };
  render();
}
const RENDERERS={
  observe(api){
    const c=api.case,D=api.D;

    const trayRow=U.el('div',{class:'trays',style:{marginTop:'12px',gridTemplateColumns:'repeat(2,minmax(0,1fr))'}});
    const bins={e:[],i:[]};
    [['e','Evidence (observed)','q'],['i','Inference (interpreted)','i']].forEach(t=>{
      const tr=U.el('div',{class:'tray '+t[2]});
      tr.innerHTML='<div class="th"><b>'+t[1]+'</b></div>';
      const items=U.el('div',{class:'items'});

      DND.dropNode(tr,(el)=>{
        const kind=classify(el.__text);
        const want=t[0];
        const isEvidence=(kind==='q'||kind==='n');
        const ok=(want==='e')?isEvidence:(kind==='i');
        if(!ok){
          api.fb('warn',kind==='i'
            ? 'That sentence explains <b>why</b>. It may well be reasonable — but you did not observe it directly, so it belongs with the inferences.'

          SC.rec('evidence',false); SC.retry(); SC.rec('accuracy',false);
