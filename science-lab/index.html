      tb.setAttribute('data-trend','1');
      tb.innerHTML='<div class="panel-h"><h3>Trend and conclusion</h3><span class="sub">describe the pattern, then state whether the evidence supports the hypothesis</span></div>';
      const ti=U.el('textarea',{class:'inp',placeholder:'As … changes, … . The evidence supports / does not support the hypothesis because …'});
      tb.appendChild(ti);
      const btn=U.el('button',{class:'btn p sm',style:{marginTop:'8px'},text:'Submit'});
      tb.appendChild(btn);
      api.host.appendChild(tb);
      tb.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
      btn.onclick=async()=>{
        const v=ti.value.trim();
        if(v.length<15){ api.fb('warn','Write a full answer.'); return; }
        const s=kwScore(v,c.trendKw);
        const sup=/\b(support|supported|supports)\b/i.test(v);
        const proven=/\b(prove|proven|proves)\b/i.test(v);
        const local={pass:s.m>=2&&sup&&!proven,
          feedback:proven?'Evidence never proves a hypothesis — it supports it or fails to support it.'
            :(!sup?'State plainly whether the evidence supports the hypothesis.'
            :(s.m<2?'Name both variables and the direction each moves.':'Well stated.'))};
        api.fb('info','<span class="judging"><span class="sp"></span> Judge reading your answer…</span>');
        const res=await grade({concept:'interpreting data',question:c.question,studentAnswer:v,
          rubric:['describes the correct trend','states whether the evidence supports the hypothesis','does not claim proof'],local});
        const fbEl=U.$('.camp-fb',api.host); if(fbEl&&fbEl.firstChild) fbEl.firstChild.remove();
        api.fb(res.pass?'good':'warn','<b>'+(res.pass?'That is a proper conclusion.':'Read your data again.')+'</b> '+U.esc(res.feedback));
        if(res.pass){
          SC.rec('data',true); M.rec(['data','hypo'],true); SC.xp(26,tb); SC.station('campaign',26,300);
          ti.disabled=true; btn.disabled=true;
          const n=U.el('button',{class:'btn p',style:{marginTop:'12px'},text:'Close the case →'});
          n.onclick=api.advance; api.host.appendChild(n);
        } else { SC.rec('data',false); SC.retry(); }
      };
    }
    DND.bind(api.host);
    draw();
  },
  verdict(api){ api.advance(); }
};

/* ============================================================
   13 · FREE LAB — design your own experiment
   ============================================================ */
function viewFree(host){
  const st={id:'free'};
  const {body}=shell(host,{n:'Free Lab',ico:'build',d:''},{title:'Design your own experiment',sub:'Invent an investigation. The judge will push back until the design holds up.'});
  const F=S.free||(S.free={});
  const fields=[
    ['test','I want to test…','e.g. How does the amount of sugar affect how fast yeast inflates a balloon?'],
    ['change','I will change…','the one factor you set differently between trials'],
    ['measure','I will measure…','the outcome, with units — what number comes out at the end'],
    ['keep','I will keep these constant…','list them, separated by commas'],
    ['hypo','My hypothesis…','If … then … because …'],
    ['proc','My procedure…','step by step, including how many trials and how long each runs']
  ];
  const panel=U.el('div',{class:'panel solid'});
  fields.forEach(f=>{
    const d=U.el('div',{class:'field',style:{marginBottom:'10px'}});
    d.appendChild(U.el('label',{text:f[1]}));
    const ta=U.el('textarea',{class:'inp',placeholder:f[2],style:{minHeight:'58px'},'data-f':f[0]});
    ta.value=F[f[0]]||'';
    ta.addEventListener('input',()=>{ F[f[0]]=ta.value; save(); });
    d.appendChild(ta);
    panel.appendChild(d);
  });
  body.appendChild(panel);
  const bar=U.el('div',{class:'row',style:{marginTop:'12px'}});
  const val=U.el('button',{class:'btn p',text:'Validate my design'});
  const clr=U.el('button',{class:'btn q sm',text:'Clear'});
  bar.appendChild(val); bar.appendChild(clr);
  body.appendChild(bar);
  clr.onclick=()=>{ S.free={}; save(); viewFree(host); };
  const out=U.el('div',{style:{marginTop:'12px',display:'grid',gap:'10px'}});
  body.appendChild(out);

  function localValidate(v){
    const issues=[];
    const test=(v.test||'').trim(), change=(v.change||'').trim(), meas=(v.measure||'').trim();
    const keep=(v.keep||'').trim(), hypo=(v.hypo||'').trim(), proc=(v.proc||'').trim();
    if(test.length<8) issues.push('Say what relationship you are testing. “How does X affect Y?” is enough.');
    if(change.length<3) issues.push('Name the single factor you will deliberately change.');
    else {
      const parts=change.split(/\band\b|,|\+/i).map(s=>s.trim()).filter(s=>s.length>2);
      if(parts.length>1) issues.push('You changed both “'+parts[0]+'” and “'+parts.slice(1).join('”, “')+'”, so you will not know which one caused the result. Pick one factor to manipulate and hold the others constant.');
    }
    if(meas.length<3) issues.push('Name the outcome you will measure.');
    else if(/\b(health|healthy|better|worse|good|bad|nice|quality|happy|strong|well)\b/i.test(meas)&&!/(\bcm\b|ml|°?c|\bg\b|second|minute|per |count|number|mass|height|time|rate|distance|volume|bpm|words|\d)/i.test(meas))
      issues.push('“'+meas+'” is vague. What measurable result could represent it — a count, a length, a mass, a time?');
    const keeps=keep.split(/[,\n;]/).map(s=>s.trim()).filter(s=>s.length>2);
    if(keeps.length<3) issues.push('List at least three conditions you will keep identical. Without them the comparison is not fair.');
    if(change&&keeps.some(k=>U.norm(k).indexOf(U.norm(change).split(' ')[0])>=0&&U.norm(change).length>3))
      issues.push('“'+keeps.filter(k=>U.norm(k).indexOf(U.norm(change).split(' ')[0])>=0)[0]+'” appears both as the factor you change and as a constant. It cannot be both.');
    if(hypo.length<8) issues.push('Write the hypothesis: If [the factor changes], then [the measurable outcome changes], because [reasoning].');
    else {
      if(!/\bif\b/i.test(hypo)||!/\bthen\b/i.test(hypo)) issues.push('Your hypothesis predicts an outcome, but does not say what variable causes the change. Use If … then … because …');
      if(!/\bbecause\b/i.test(hypo)) issues.push('Add the reasoning — the “because” is what makes it a scientific explanation rather than a guess.');
      if(/\b(prove|proven)\b/i.test(hypo)) issues.push('A hypothesis is never proven. Write it so evidence can support it or fail to support it.');
    }
    if(proc.length<10) issues.push('Write the procedure: what you set up, how many trials, and how long each trial runs.');
    else {
      if(!/\d/.test(proc)) issues.push('Your procedure has no numbers. How many trials, and how long is each observation window?');
      if(!/\b(trial|repeat|three|3|two|2|each)\b/i.test(proc)) issues.push('State how many repeated trials you will run — one trial cannot separate a real effect from random variation.');
    }
    return issues;
  }
  val.onclick=async()=>{
    const v={};
    U.$$('[data-f]',panel).forEach(n=>v[n.getAttribute('data-f')]=n.value);
    const issues=localValidate(v);
    const pass=issues.length===0;
    out.insertBefore(UI.judging(),out.firstChild);
    const res=await grade({concept:'experimental design',alwaysAI:true,ms:12000,
      question:'A student designed their own experiment. Evaluate the design.',
      studentAnswer:JSON.stringify(v),
      rubric:['changes exactly one independent variable','measures a specific, quantifiable dependent variable','holds at least three relevant conditions constant','hypothesis is testable and gives reasoning','procedure includes repeated trials and a defined observation window'],
      local:{pass,feedback:pass?'This design would run.':'The design still has problems.',missing:issues,score:pass?1:0}});
    out.firstChild.remove();
    const all=issues.concat((res.missing||[]).filter(m=>issues.indexOf(m)<0)).slice(0,8);
    const ok=pass&&res.pass;
    const card=U.el('div',{class:'panel solid'});
    card.innerHTML='<div class="panel-h"><h3>'+(ok?'Design validated':'Design needs work')+'</h3><span class="sub">'+(res.src==='ai'?'AI judge':'local judge')+'</span></div>'
      +(res.feedback?'<p class="tiny">'+U.esc(res.feedback)+'</p>':'')
      +(all.length?'<div style="margin-top:8px">'+all.map(i=>'<div class="tiny">• '+U.esc(i)+'</div>').join('')+'</div>':'')
      +(ok?'<p class="tiny" style="margin-top:10px"><b>Independent variable:</b> '+U.esc(v.change)+' · <b>Dependent variable:</b> '+U.esc(v.measure)+' · <b>Constants:</b> '+U.esc(v.keep)+'</p>':'');
    out.insertBefore(card,out.firstChild);
    if(ok){
      SC.badge('designer');
      SC.rec('design',true); M.rec(['cx','iv','dv','cv','hypo'],true); SC.xp(40,card);
      card.appendChild(UI.feed('good','<b>That is a controlled experiment.</b> One factor manipulated, one measurable outcome, constants locked, repeated trials, and a hypothesis that evidence can support or fail to support.'));
      const r=U.el('div',{class:'row',style:{marginTop:'12px'}});
      const again=U.el('button',{class:'btn q',text:'Design another'});
      again.onclick=()=>{ S.free={}; save(); viewFree(host); };
      r.appendChild(again); card.appendChild(r);
    } else {
      SC.rec('design',false); SC.retry();
      card.appendChild(UI.feed('info','Nothing here is “wrong” — a design is a draft you sharpen. Fix the notes above and validate again.'));
    }
    card.scrollIntoView({behavior:U.reduced()?'auto':'smooth',block:'nearest'});
  };
}

/* ============================================================

function radar(el,vals){
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 220 200'); svg.style.width='220px'; svg.style.height='200px';
  const cx=110,cy=104,R=76;
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/vals.length; return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]; };
  const mk=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
  [0.25,0.5,0.75,1].forEach(f=>{
    const d=vals.map((v,i)=>pt(i,R*f).join(',')).join(' ');
    svg.appendChild(mk('polygon',{points:d,fill:'none',stroke:'rgba(18,40,38,.10)','stroke-width':'1'}));
  });
  vals.forEach((v,i)=>{
    const p=pt(i,R);
    svg.appendChild(mk('path',{d:'M'+cx+' '+cy+'L'+p[0]+' '+p[1],stroke:'rgba(18,40,38,.10)','stroke-width':'1'}));
    const lp=pt(i,R+18);
    const t=mk('text',{x:lp[0],y:lp[1],'text-anchor':'middle','font-size':'8.5',fill:'#647774','font-weight':'700'});
    t.textContent=v.label; svg.appendChild(t);
  });
  const d=vals.map((v,i)=>pt(i,R*U.clamp(v.v/100,0.04,1)).join(',')).join(' ');
  svg.appendChild(mk('polygon',{points:d,fill:'rgba(15,157,122,.22)',stroke:'#0f9d7a','stroke-width':'2'}));
  vals.forEach((v,i)=>{ const p=pt(i,R*U.clamp(v.v/100,0.04,1)); svg.appendChild(mk('circle',{cx:p[0],cy:p[1],r:3.5,fill:'#0d8f6f'})); });
  el.appendChild(svg);
}

  right.appendChild(bd);

const CONCEPT_STATION={obs:'s/obs',qual:'s/obs',quant:'s/obs',inf:'s/detective',hypo:'s/hypo',iv:'s/wire',dv:'s/wire',cv:'s/wire',cg:'s/control',eg:'s/control',cx:'s/repair',data:'s/build',sci_tech:'s/workshop'};
function viewTraining(host){

  auto.onclick=()=>{ const k=M.pick(Object.keys(CONCEPTS)); go(CONCEPT_STATION[k]||'s/obs'); };

      +'<div class="prog"><i style="width:'+M.lv(k)+'%"></i></div>'
      +'<div class="st"><span>mastery '+M.lv(k)+'</span><span>'+M.data(k).t+' reps</span></div>';

    grid.appendChild(b);
  });
  wrap.appendChild(grid);

}
/* ============================================================
   15 · ROUTER + BOOT
   ============================================================ */
const VIEWS={
  observation:viewObservation,
  detective:viewDetective,
  hypothesis:viewHypothesis,
  wiring:viewWiring,
  control:viewControl,
  workshop:viewWorkshop,
  build:viewBuild,
  repair:viewRepair,
  campaign:viewCampaign
};
const view=U.$('#view');
function go(path){
  const target='#/'+String(path||'home').replace(/^#?\/?/,'');
  if(location.hash===target) route();
  else location.hash=target;
}
function route(){
  const h=(location.hash||'#/home').replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  window.scrollTo({top:0,behavior:'auto'});
  try{
    if(!parts.length||parts[0]==='home') viewHome(view);
    else if(parts[0]==='free'){
      if(S.restored.length<1){ UI.toast('Bring one station online first — the Observation Lab is open.'); viewHome(view); }
      else viewFree(view);
    }
    else if(parts[0]==='skills') viewSkills(view);
    else if(parts[0]==='training') viewTraining(view);
    else if(parts[0]==='campaign'){
      const st=stById('campaign');
      if(!unlocked(st)){ UI.toast('Investigation Zero unseals once '+st.need+' stations are restored.'); viewHome(view); }
      else viewCampaign(view);
    }
    else if(parts[0]==='s'){
      const st=stById(parts[1]);
      if(!st){ viewHome(view); return; }
      if(!unlocked(st)){ UI.toast(st.n+' is sealed — restore '+st.need+' station'+(st.need===1?'':'s')+' first.'); viewHome(view); return; }
      const fn=VIEWS[st.mode];
      if(!fn){ viewHome(view); return; }
      fn(view,parts[2]?{id:parts[2]}:null);
    }
    else viewHome(view);
  }catch(err){
    /* never leave the player with a blank screen */
    UI.clear(view);
    const p=U.el('div',{class:'panel solid'});
    p.innerHTML='<div class="panel-h"><h3>That station hiccuped</h3></div><p class="tiny">Something went wrong while rendering. Your progress is safe.</p>';
    const b=U.el('button',{class:'btn p',style:{marginTop:'10px'},text:'Back to the lab map'});
    b.onclick=()=>go('home'); p.appendChild(b); view.appendChild(p);
    if(window.console&&console.error) console.error(err);
  }
  paintDock();
}
function paintDock(){
  const dock=U.$('#dock'); if(!dock) return;
  const h=(location.hash||'').replace(/^#\/?/,'');
  if(!dock.children.length){
    const add=(label,path,icoId,disabled)=>{
      const b=U.el('button',{html:icon(icoId)+'<span>'+U.esc(label)+'</span>',title:label,'data-path':path});
      if(disabled) b.setAttribute('disabled','');
      b.onclick=()=>go(path);
      dock.appendChild(b);
    };
    add('Lab','home','campaign',false);
    STATIONS.forEach(s=>add(s.n.split(' ')[0],'s/'+s.id,s.ico,!unlocked(s)));
    add('Free','free','build',S.restored.length<1);
    add('Skills','skills','wire',false);
  }
  U.$$('button',dock).forEach(b=>{
    b.setAttribute('aria-current',b.getAttribute('data-path')===h?'true':'false');
    const id=(b.getAttribute('data-path')||'').replace('s/','');
    const st=stById(id);
    if(st){ if(unlocked(st)) b.removeAttribute('disabled'); else b.setAttribute('disabled',''); }
    if(b.getAttribute('data-path')==='free'){ if(S.restored.length<1) b.setAttribute('disabled',''); else b.removeAttribute('disabled'); }
  });
}
function boot(){
  S=load();
  syncHUD();
  U.$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.getAttribute('data-go'))));
  const sk=U.$('#btn-skills'); if(sk) sk.onclick=()=>go('skills');
  const menu=U.$('#btn-menu');
  if(menu) menu.onclick=()=>{
    const body=U.el('div');
    const items=[['Lab map','home'],['Free Lab','free'],['Skill map','skills'],['Skill training','training'],['Continue investigation','campaign']];
    items.forEach(it=>{
      const b=U.el('button',{class:'btn wide q',style:{marginBottom:'6px'},text:it[0]});
      b.onclick=()=>{ go(it[1]); if(m) m.close(); };
      body.appendChild(b);
    });
    body.appendChild(U.el('div',{class:'divider'}));
    body.appendChild(U.el('p',{class:'tiny',html:'<b>About the judge.</b> Free-form answers are graded locally first. If your answer is correct you are never kept waiting. When an answer looks wrong or needs a nuanced read, an AI grader is consulted — and if it is unavailable the local grader carries on. Nothing you type is stored by the game beyond your own progress file.'}));
    const rs=U.el('button',{class:'btn w wide sm',style:{marginTop:'10px'},text:'Reset all progress'});
    rs.onclick=()=>{ if(m) m.close(); UI.modal({title:'Reset the laboratory?',body:'Every station, badge and mastery score will be cleared.',actions:[{label:'Cancel'},{label:'Reset everything',cls:'w',fn:()=>{Store.reset();go('home');}}]}); };
    body.appendChild(rs);
    const m=UI.modal({title:'Menu',body});
  };
  window.addEventListener('hashchange',route);
  AI.init();
  route();
  if(!localStorage.getItem(KEY+'.seen')){
    try{localStorage.setItem(KEY+'.seen','1');}catch(e){}
    setTimeout(()=>UI.toast('⚡ Nine stations are dark. Start with the Observation Lab.','g'),700);
  }
}
/* test/inspection hook */
window.SCIENCELAB={
  get state(){return S;},go,route,
  ai:AI,grade,store:Store,mastery:M,score:SC,
  banks:{OBS,WIRE,BROKEN,HYPO,CTRL,CASES,WORKSHOP,BRIEFS,MYSTERY},
  views:VIEWS,stations:STATIONS,
  simulate:{scoreHypo,kwScore,simValue,localValidateFree:null}
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
